/* ===================== Agent run log (v1.0.10) ===================== */
// Status per run: success | partial | failed | skipped | running | crashed (runner v1.0.13+), plus "missed", computed here from the schedule.
// errKind() must match error_kind() in runner/job_driver_runner.py and public.job_driver_error_kind() in Supabase.
const RUN_ST = {success:['ok','Success'], partial:['warn','Partial'], failed:['bad','Failed'], crashed:['bad','Crashed'], missed:['bad','Missed'], skipped:['','Skipped'], running:['new','Running']};
const RUN_PROBLEM = ['partial','failed','crashed','missed'];
const ERR_KIND = {setup:'Setup: needs you', ai_limit:'AI over limit (429)', ai_busy:'AI busy (503)', format:'Wrong reply format', network:'Network', gmail:'Gmail', jd_fetch:'Job page fetch', other:'Other'};
const ERR_RX = [['setup',/\b40[123]\b|free tier users|insufficient|no AI_GATEWAY|missing secret|api key|unauthori|forbidden|credits/i], ['ai_limit',/\b429\b|rate limit|quota|limit hit|max AI calls|no AI model available/i], ['ai_busy',/\b503\b|high demand|overloaded|unavailable/i], ['format',/format|json|parse|did not match/i], ['gmail',/imap|\bUID\b|gmail|socket error: EOF/i], ['network',/network|urlopen|timed? ?out|connection|socket|unreachable|reset by peer/i], ['jd_fetch',/linkedin HTTP|page HTTP|job description/i]];
function errKind(t){ for (const [k,rx] of ERR_RX) if (rx.test(t||'')) return k; return 'other'; }
function errText(e){ return typeof e==='string' ? e : (e && (e.error || JSON.stringify(e))) || ''; }
function runErrs(r){ return Array.isArray(r.errors) ? r.errors : (r.errors ? [r.errors] : []); }
function runKinds(r){ return (r.error_kinds && r.error_kinds.length) ? r.error_kinds : [...new Set(runErrs(r).map(e=>errKind(errText(e))))]; }
function runStatus(r){
  if (r._missed) return 'missed';
  if (r.status==='running' && Date.now()-new Date(r.started_at).getTime() > 40*60000) return 'crashed';
  if (r.status) return r.status;
  if (!runErrs(r).length) return 'success';   // rows from before runner v1.0.13 that the backfill did not reach
  return ((r.items_created||0)+(r.items_parked||0)>0) ? 'partial' : 'failed';
}
function stTag(s){ const [c,l]=RUN_ST[s]||['',s]; return `<span class="tag ${c}">${esc(l)}</span>`; }
function stDot(s){ const col = s==='success'?'var(--accent)':(s==='partial'?'var(--warn)':(s==='skipped'||!s?'var(--muted)':(s==='running'?'var(--new)':'var(--bad)'))); return `<span title="${esc((RUN_ST[s]||[0,s||'no runs'])[1])}" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${col};flex:none"></span>`; }
function runLen(r){ if (!r.finished_at) return ''; const s=Math.round((new Date(r.finished_at)-new Date(r.started_at))/1000); return s<90?s+' s':Math.round(s/60)+' min'; }
const RUN_AGENT_NAMES = {sourcer:['sourcer+fit'], jd_fetcher:['sourcer+fit'], fit:['sourcer+fit','fit_shadow','evals'], resume_decider:['resume_decider'], notifier:['notifier','replies'], status_sync:['status_sync'], sweeps:['sweeps']};
// How often each run name should appear, from the Agents screen schedule (the runner wakes about every 2 h)
function runExpectH(agents){
  const exp = {replies:2};
  for (const a of agents||[]) {
    if (!a.enabled || a.built_status==='not_built') continue;
    const sch=a.schedule||{}, m=sch.mode||'every_run';
    const h = m==='nightly'?24:(m==='every_n_hours'?Number(sch.hours||4):2);
    for (const n of (RUN_AGENT_NAMES[a.key]||[])) { if (n==='fit_shadow'||n==='evals') continue; exp[n]=Math.min(exp[n]||999, h); }
  }
  return exp;
}
function lateLimitH(h){ return h>=24 ? 30 : h*1.5+1; }
// Synthetic "missed" rows for gaps longer than the late limit, inside [from, now]
function addMissed(runs, exp, from){
  const out=[...runs], now=Date.now(), byAg={};
  runs.forEach(r=>(byAg[r.agent]=byAg[r.agent]||[]).push(r));
  for (const [ag,h] of Object.entries(exp)) {
    const lim=lateLimitH(h)*3600e3, list=(byAg[ag]||[]).map(r=>new Date(r.started_at).getTime()).sort((a,b)=>a-b);
    if (!list.length) continue;
    const pts=[...list, now];
    for (let i=1;i<pts.length;i++){ const gap=pts[i]-pts[i-1]; if (gap>lim){ const at=pts[i-1]+h*3600e3; if (at>=from) out.push({id:'missed-'+ag+'-'+at, agent:ag, _missed:true, started_at:new Date(at).toISOString(), summary:`No run for ${Math.round(gap/3600e3)} h (expected every ${h<24?h+' h':'night'})`}); } }
  }
  return out.sort((a,b)=>new Date(b.started_at)-new Date(a.started_at));
}
function runHealth(runs, names, expH){
  const own=runs.filter(r=>names.includes(r.agent) && !r._missed).sort((a,b)=>new Date(b.started_at)-new Date(a.started_at));
  const last=own[0]; const t=Date.now();
  const rate=(hrs)=>{ const w=own.filter(r=>t-new Date(r.started_at)<hrs*3600e3 && !['skipped','running'].includes(runStatus(r))); return w.length?Math.round(100*w.filter(r=>runStatus(r)==='success').length/w.length):null; };
  let streak=0; for (const r of own){ const s=runStatus(r); if (s==='skipped'||s==='running') continue; if (['failed','crashed'].includes(s)) streak++; else break; }
  const late = last && expH ? (t-new Date(last.started_at) > lateLimitH(expH)*3600e3) : false;
  return {last, rate24:rate(24), rate7:rate(168), streak, late, status: late?'missed':(last?runStatus(last):null)};
}
function healthLine(h, expH){
  if (!h.last) return '<span class="muted">no runs yet</span>';
  return `${stTag(h.status)} last ${fmtDT(h.last.started_at)} · 24 h ${h.rate24==null?'—':h.rate24+'%'} · 7 d ${h.rate7==null?'—':h.rate7+'%'}${h.streak?` · <b style="color:var(--bad)">${h.streak} failed in a row</b>`:''}${h.late?` · <b style="color:var(--bad)">late: expected every ${expH>=24?'night':expH+' h'}</b>`:''}`;
}
async function loadRunRange(names, fromIso, toIso){
  let qb = sb.from('agent_runs').select('*').gte('started_at', fromIso).order('started_at',{ascending:false}).limit(2000);
  if (toIso) qb = qb.lte('started_at', toIso);
  if (names && names.length) qb = qb.in('agent', names);
  return q(qb);
}

// The shared run list: used by the Runs screen (all agents) and by each agent's Runs tab (names = that agent's run names).
async function renderRunLog(el, {names=null, agents=null, detailBack=null}={}){
  agents = agents || state.agents || await q(sb.from('agents').select('*').order('sort'));
  state.agents = agents;
  const expAll = runExpectH(agents);
  state.rlf = state.rlf || {}; const fkey = names ? names.join(',') : 'all';
  const f = state.rlf[fkey] = state.rlf[fkey] || {show:100, range:'24h', from:'', to:'', agent:'', status:'', kind:'', model:'', backup:'', text:''};
  const now = Date.now();
  const hrs = {'2h':2,'24h':24,'7d':168,'30d':720}[f.range];
  const fromMs = f.range==='custom' && f.from ? new Date(f.from).getTime() : now - (hrs||24)*3600e3;
  const toIso = f.range==='custom' && f.to ? new Date(f.to).toISOString() : null;
  const healthFrom = new Date(now - 8*24*3600e3).toISOString();
  el.innerHTML = '<div class="muted">Loading runs…</div>';
  const [rangeRuns, healthRuns] = await Promise.all([loadRunRange(names, new Date(fromMs).toISOString(), toIso), loadRunRange(names, healthFrom, null)]);
  const exp = names ? Object.fromEntries(Object.entries(expAll).filter(([k])=>names.includes(k))) : expAll;
  let runs = addMissed(rangeRuns, exp, fromMs);
  if (toIso) runs = runs.filter(r=>new Date(r.started_at)<=new Date(toIso));
  const agentOpts=[...new Set(runs.map(r=>r.agent))].sort(), modelOpts=[...new Set(rangeRuns.map(r=>r.model).filter(m=>m&&m!=='-'))].sort();
  const shown = runs.filter(r=>{ const s=runStatus(r);
    if (f.agent && r.agent!==f.agent) return false;
    if (f.status==='problems' ? !RUN_PROBLEM.includes(s) : (f.status && s!==f.status)) return false;
    if (f.kind && !runKinds(r).includes(f.kind)) return false;
    if (f.model && r.model!==f.model) return false;
    if (f.backup==='yes' && !r.backup_used) return false;
    if (f.backup==='no' && r.backup_used) return false;
    if (f.text){ const t=f.text.toLowerCase(); if (!((r.summary||'')+' '+JSON.stringify(r.errors||'')).toLowerCase().includes(t)) return false; }
    return true; });
  // health: one card per live agent (all view) or a single line (agent tab)
  let healthHtml='';
  if (!names) {
    const live = agents.filter(a=>a.built_status!=='not_built');
    const shadow = healthRuns.some(r=>r.agent==='fit_shadow') ? runHealth(healthRuns, ['fit_shadow'], null) : null;
    healthHtml = `<div class="cards" style="margin-bottom:12px">${live.map(a=>{ const nm=RUN_AGENT_NAMES[a.key]||[a.key]; const h=runHealth(healthRuns, nm.filter(n=>n!=='evals'&&n!=='fit_shadow'), expAll[nm[0]]);
      return `<div class="card rlcard" data-ag="${esc(nm[0])}" style="cursor:pointer"><div style="display:flex;gap:8px;align-items:center">${a.enabled?stDot(h.status):stDot('skipped')}<h4 style="margin:0;flex:1">${esc(a.name)}</h4>${a.enabled?'':'<span class="tag">off</span>'}</div>
        <div class="mono muted" style="margin-top:6px">${healthLine(h, expAll[nm[0]])}</div></div>`; }).join('')}${shadow?`<div class="card rlcard" data-ag="fit_shadow" style="cursor:pointer"><div style="display:flex;gap:8px;align-items:center">${stDot(shadow.status)}<h4 style="margin:0;flex:1">Fit shadow (Jev)</h4><span class="tag">test only</span></div><div class="mono muted" style="margin-top:6px">${healthLine(shadow, null)}</div></div>`:''}</div>`;
  } else {
    const h = runHealth(healthRuns, names.filter(n=>n!=='evals'&&n!=='fit_shadow'), exp[names[0]]);
    healthHtml = `<div class="callout ${h.status && h.status!=='success' && h.status!=='skipped' ? 'warn':''}" style="display:flex;gap:8px;align-items:center">${stDot(h.status)}<span>${healthLine(h, exp[names[0]])}</span></div>`;
  }
  // error groups
  const groups={};
  shown.filter(r=>!r._missed).forEach(r=>runErrs(r).forEach(e=>{ const t=errText(e), k=(r.error_kinds&&r.error_kinds.length===1)?r.error_kinds[0]:errKind(t); const g=groups[k]=groups[k]||{n:0,last:null,sample:'',agents:new Set()}; g.n++; g.agents.add(r.agent); if(!g.last||r.started_at>g.last){ g.last=r.started_at; g.sample=t; } }));
  const missedN = shown.filter(r=>r._missed).length;
  const gl = Object.entries(groups).sort((a,b)=>b[1].n-a[1].n);
  const groupsHtml = (gl.length||missedN) ? `<h3>Errors by type <span class="muted" style="font-weight:400;font-size:13px">in the runs shown</span></h3><div class="cards" style="margin-bottom:12px">
    ${gl.map(([k,g])=>`<div class="card rlkind" data-k="${k}" style="cursor:pointer;${k==='setup'?'border-color:var(--bad)':''}"><div style="display:flex;gap:8px;align-items:center"><h4 style="margin:0;flex:1">${esc(ERR_KIND[k]||k)}</h4><b class="mono">${g.n}</b></div>
      <div class="mono muted" style="margin-top:4px">last ${fmtDT(g.last)} · ${esc([...g.agents].join(', '))}</div><div class="muted" style="font-size:12.5px;margin-top:4px;overflow-wrap:anywhere">${esc(g.sample.slice(0,140))}</div>
      ${k==='setup'?'<div style="color:var(--bad);font-size:12.5px;margin-top:4px">Needs you: a key, credits or access. Waiting will not fix it.</div>':''}</div>`).join('')}
    ${missedN?`<div class="card rlkind" data-k="__missed" style="cursor:pointer;border-color:var(--bad)"><div style="display:flex;gap:8px;align-items:center"><h4 style="margin:0;flex:1">Missed slots</h4><b class="mono">${missedN}</b></div><div class="muted" style="font-size:12.5px;margin-top:4px">Expected runs that never wrote a row: the runner was down, or the chain broke.</div></div>`:''}</div>` : '';
  const sel=(id,cur,opts)=>`<select id="${id}" style="width:auto">${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(cur)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  el.innerHTML = `${healthHtml}${groupsHtml}
    <div class="toolbar">
      ${sel('rlRange', f.range, [['2h','Last 2 hours'],['24h','Last 24 hours'],['7d','Last 7 days'],['30d','Last 30 days'],['custom','Custom range']])}
      <span id="rlCustom" class="${f.range==='custom'?'':'hidden'}" style="display:inline-flex;gap:6px;align-items:center"><input type="datetime-local" id="rlFrom" value="${esc(f.from)}" style="width:auto"> to <input type="datetime-local" id="rlTo" value="${esc(f.to)}" style="width:auto"></span>
      ${names && names.length<2 ? '' : sel('rlAgent', f.agent, [['','All agents'], ...agentOpts.map(a=>[a,a])])}
      ${sel('rlStatus', f.status, [['','Any status'],['problems','Problems only'], ...Object.entries(RUN_ST).map(([k,v])=>[k,v[1]])])}
      ${sel('rlKind', f.kind, [['','Any error type'], ...Object.entries(ERR_KIND)])}
      ${sel('rlModel', f.model, [['','Any model'], ...modelOpts.map(m=>[m,m])])}
      ${sel('rlBackup', f.backup, [['','Backup AI: any'],['yes','Backup AI used'],['no','No backup']])}
      <input class="grow" id="rlText" placeholder="search summary or error" value="${esc(f.text)}">
    </div>
    <div class="muted mono" style="margin-bottom:6px">${shown.length} of ${runs.length} runs${rangeRuns.length>=2000?' (first 2,000 in this range; narrow the dates)':''}</div>
    <div class="tablewrap"><table><thead><tr><th>Started</th><th>Agent</th><th>Status</th><th class="r hide-sm">Read · new · parked</th><th class="r hide-sm">AI calls</th><th class="hide-sm">Error type</th><th>Summary</th></tr></thead><tbody>
    ${shown.slice(0,f.show).map(r=>{ const s=runStatus(r), ks=runKinds(r);
      return `<tr class="row rlrow" data-id="${esc(r.id)}"><td class="nowrap">${fmtDT(r.started_at)}${runLen(r)?`<div class="cell-sub">${runLen(r)}</div>`:''}</td><td class="nowrap">${esc(hum(r.agent))}</td><td>${stTag(s)}</td>
        <td class="r num hide-sm">${r._missed?'':`${r.items_read??0} · ${r.items_created??0} · ${r.items_parked??0}`}</td>
        <td class="r hide-sm"><span class="num">${r.ai_calls??''}</span>${r.model&&r.model!=='-'?`<div class="cell-sub" style="justify-content:flex-end">${esc(r.model)}${r.backup_used?' · backup':''}</div>`:''}</td>
        <td class="hide-sm">${ks.map(k=>`<span class="tag ${k==='setup'?'bad':''}">${esc(ERR_KIND[k]||k)}</span>`).join(' ')}</td>
        <td><div class="clip" style="font-size:13.5px">${esc((r.summary||'').slice(0,180))}</div></td></tr>`; }).join('') || emptyRow(7,'No runs match these filters.','')}
    </tbody></table></div>${shown.length>f.show?`<div class="actions"><button id="rlMore">Show ${Math.min(100, shown.length-f.show)} more</button><span class="muted mono">showing ${f.show} of ${shown.length}</span></div>`:''}`;
  const re = ()=>renderRunLog(el, {names, agents, detailBack});
  const bind=(id,key,ev='onchange')=>{ const x=el.querySelector('#'+id); if (x) x[ev]=()=>{ f[key]=x.value; f.show=100; re(); }; };
  bind('rlRange','range'); bind('rlAgent','agent'); bind('rlStatus','status'); bind('rlKind','kind'); bind('rlModel','model'); bind('rlBackup','backup');
  const fr=el.querySelector('#rlFrom'), to=el.querySelector('#rlTo');
  if (fr) fr.onchange=()=>{ f.from=fr.value; if (f.from) re(); };
  if (to) to.onchange=()=>{ f.to=to.value; re(); };
  const tx=el.querySelector('#rlText'); let tmr; if (tx) tx.oninput=()=>{ clearTimeout(tmr); tmr=setTimeout(()=>{ f.text=tx.value; re(); setTimeout(()=>{ const n=el.querySelector('#rlText'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },0); },400); };
  const more=el.querySelector('#rlMore'); if (more) more.onclick=()=>{ f.show+=100; re(); };
  el.querySelectorAll('.rlcard').forEach(c=>c.onclick=()=>{ f.agent = f.agent===c.dataset.ag ? '' : c.dataset.ag; re(); });
  el.querySelectorAll('.rlkind').forEach(c=>c.onclick=()=>{ if (c.dataset.k==='__missed'){ f.status = f.status==='missed'?'':'missed'; f.kind=''; } else { f.kind = f.kind===c.dataset.k ? '' : c.dataset.k; } re(); });
  el.querySelectorAll('.rlrow').forEach(tr=>tr.onclick=()=>{ const r=runs.find(x=>String(x.id)===tr.dataset.id); if (r) runDetail(r, detailBack || (()=>closeModal())); });
}

async function runDetail(r, back){
  const s = runStatus(r), errs = runErrs(r);
  let created=[], named=[];
  if (!r._missed) {
    const ids=[...new Set(errs.map(e=>e && (e.lead||e.lead_id)).filter(Boolean))];
    [created, named] = await Promise.all([
      q(sb.from('leads').select('id,title,company,status,fit_score,resume_decision').eq('agent_run_id', r.id).limit(100)).catch(()=>[]),
      ids.length ? q(sb.from('leads').select('id,title,company,status,fit_score').in('id', ids)).catch(()=>[]) : Promise.resolve([])]);
  }
  const lname = id => { const l=named.find(x=>x.id===id); return l ? `${l.company} · ${l.title}` : id; };
  openModal(`<div style="display:flex;align-items:center;gap:8px"><h3 style="flex:1">${esc(r.agent)} · ${fmtDT(r.started_at)}</h3>${stTag(s)}</div>
    ${r._missed ? `<div class="callout warn">${esc(r.summary)}. No row was written, so the runner did not run at all in that slot (GitHub chain stopped, an outage, or the workflow was off). Check the Actions tab; to restart: Run workflow, mode run, chain ticked.</div>` : `
    <div class="grid2"><div>
      <label>Length</label><div class="mono">${runLen(r)||(s==='running'?'still running':'never finished')}</div>
      <label>Read · created · parked</label><div class="mono">${r.items_read??0} · ${r.items_created??0} · ${r.items_parked??0}</div>
      <label>Model</label><div class="mono">${esc(r.model||'-')}${r.backup_used?' · <span class="tag warn">Groq backup used</span>':''}</div>
    </div><div>
      <label>AI calls · tokens in / out</label><div class="mono">${r.ai_calls??'—'} · ${r.tokens_in??0} / ${r.tokens_out??0}</div>
      <label>Error types</label><div>${runKinds(r).map(k=>`<span class="tag ${k==='setup'?'bad':''}">${esc(ERR_KIND[k]||k)}</span>`).join(' ')||'<span class="muted">none</span>'}</div>
      <label>GitHub run</label><div>${r.github_run_url?`<a href="${esc(r.github_run_url)}" target="_blank" rel="noopener">open the run log</a>`:'<span class="muted">not recorded (runs before v1.0.13)</span>'}</div>
    </div></div>
    <label>Summary</label><pre class="text">${esc(r.summary||'(none)')}</pre>
    ${errs.length?`<h3>Errors (${errs.length})</h3><div class="tablewrap"><table><thead><tr><th>Type</th><th>Stage</th><th>Item</th><th>Error</th></tr></thead><tbody>${errs.map(e=>{ const t=errText(e); const item = e && (e.lead||e.lead_id) ? esc(lname(e.lead||e.lead_id)) : esc((e&&(e.mail||e.stream||e.application))||''); return `<tr><td><span class="tag">${esc(ERR_KIND[errKind(t)])}</span></td><td class="mono">${esc((e&&e.stage)||'')}${e&&e.attempt?` · try ${esc(e.attempt)}`:''}</td><td style="max-width:240px;overflow-wrap:anywhere">${item}</td><td style="overflow-wrap:anywhere">${esc(t.slice(0,600))}</td></tr>`; }).join('')}</tbody></table></div>`:''}
    ${created.length?`<h3>Leads created by this run (${created.length})</h3><div class="tablewrap"><table><thead><tr><th>Company</th><th>Title</th><th>Status</th><th>Fit</th><th>Resume</th></tr></thead><tbody>${created.map(l=>`<tr><td>${esc(l.company)}</td><td>${esc(l.title)}</td><td><span class="tag">${esc(l.status)}</span></td><td class="mono">${l.fit_score??''}</td><td>${esc(l.resume_decision||'')}</td></tr>`).join('')}</tbody></table></div>`:''}`}
    <div class="actions"><button id="rdBack" class="right">Back</button></div>`);
  $('#rdBack').onclick = back;
}

/* ===================== Agents (v1.0.5) ===================== */
// One row per agent in public.agents. The runner (v1.0.8+) reads this table on every pass.
// Prompt and fitment edits are saved as NEW versions (never overwritten) and only take effect once activated.
// agRubricText / agRenderSystem / agComputeFit must stay identical to render_rubric / render_system / compute_fit in runner/job_driver_runner.py.
const AG_RUN_NAMES = {sourcer:['sourcer+fit'], fit:['sourcer+fit'], jd_fetcher:['sourcer+fit'], notifier:['notifier','replies'], status_sync:['status_sync'], sweeps:['sweeps']};
const AG_BANDS = {strong:{min:80,max:100,label:'Strong · 80–100',push:true}, plausible:{min:60,max:79,label:'Plausible · 60–79',push:true}, stretch:{min:40,max:59,label:'Stretch · 40–59',push:false}, no:{min:0,max:39,label:'No · 0–39',push:false}};
const AG_MARK = {fit:'SCORE_FIT.', sourcer:'EXTRACT_JOBS.', status_sync:'CLASSIFY_STATUS.'};
const AG_OUT = {
  fit: 'Output format (fixed by the system): JSON only, no prose.\n{"scores":[{"index":<int>,"params":{"<parameter key>":{"score":<0-100 or null>,"why":"<under 120 chars>"}},"basis":"title_only | snippet | jd","note":"<under 120 chars>"}]}\nOne entry per job. Include every parameter key listed above.',
  sourcer: 'Output format (fixed by the system): JSON only.\n{"is_job_alert": true|false, "jobs": [{"title","company","location","url","easy_apply": true|false|null,"posted_text": "as written, e.g. 2 days ago, or null","snippet": "<=200 chars","stream": "one of the stream names, or null"}]}',
  status_sync: 'Output format (fixed by the system): JSON only.\n{"outcome": "rejected|interview_invite|offer|assessment|acknowledgement|other", "company": "<name>", "verbatim": "<exact sentences, or empty>", "confidence": <0-1>}'
};
function agRubricText(rub){
  const L=[];
  for (const p of (rub?.params||[])) {
    if (p.enabled===false) continue;
    const a=p.anchors||{};
    L.push(`- ${p.name} (key "${p.key}", weight ${p.weight}): ${p.description||''}`);
    L.push(`    about 90: ${a.high||''}`); L.push(`    about 50: ${a.mid||''}`); L.push(`    about 10: ${a.low||''}`);
    if (p.cap && p.cap.below!=null && p.cap.max!=null) L.push(`    Hard cap: if this is below ${p.cap.below}, the total cannot be above ${p.cap.max} (applied by the system).`);
    L.push('    If you cannot judge it: return null.' + (p.if_unknown==='skip' ? ' It is then left out of the total.' : ' It is then scored 50.'));
  }
  return L.join('\n');
}
function agStreamsDesc(streams){ return streams.map(s=>`- "${s.name}": goal=${s.goal||''}; target titles=${(s.target_titles||[]).join(', ')}`).join('\n'); }
function agRenderSystem(key, template, ctx){
  let body = template||'';
  if (key==='fit') body = body.split('{{rubric}}').join(agRubricText(ctx.rubric)).split('{{threshold}}').join(String(ctx.rubric?.threshold ?? 60));
  if (key==='sourcer') body = body.split('{{streams}}').join(agStreamsDesc(ctx.streams||[]));
  return (AG_MARK[key] ? AG_MARK[key]+'\n' : '') + body + (AG_OUT[key] ? '\n\n'+AG_OUT[key] : '');
}
// Same maths as compute_fit() in the runner: weighted mean of parameter scores, if-unknown rule, then caps.
function agComputeFit(rub, params){
  let tot=0, w=0; const caps=[];
  for (const p of (rub.params||[])) { if (p.enabled===false) continue;
    let s = params?.[p.key]?.score; s = (s===null||s===undefined||s==='') ? null : Math.max(0, Math.min(100, Number(s)));
    if (s===null) { if (p.if_unknown==='skip') continue; s=50; }
    tot += Number(p.weight)*s; w += Number(p.weight); }
  let total = w ? Math.round(tot/w) : null;
  for (const p of (rub.params||[])) { if (p.enabled===false||!p.cap||p.cap.below==null) continue; const s=params?.[p.key]?.score;
    if (s!=null && s!=='' && Number(s) < Number(p.cap.below) && total!=null && total > Number(p.cap.max)) { total = Number(p.cap.max); caps.push(p.key); } }
  return {total, caps};
}

async function openAgent(id, tab){

  openModal(`<div style="display:flex;align-items:center;gap:8px"><h3 style="flex:1">${a.design_no?`#${a.design_no} · `:''}${esc(a.name)}</h3>${agTag(a.built_status)}<button class="small" id="agClose">Close</button></div>

  if (a.built_status!=='not_built') { const nm=(RUN_AGENT_NAMES[a.key]||[a.key]).filter(n=>n!=='evals'); const expH=runExpectH(state.agents||[a]);
    q(sb.from('agent_runs').select('agent,started_at,finished_at,errors,error_kinds,status,items_created,items_parked').in('agent',nm).gte('started_at', new Date(Date.now()-8*24*3600e3).toISOString()).order('started_at',{ascending:false}).limit(500))

  try { await ({overview:agOverview, schedule:agSchedule, prompt:agPrompt, rubric:agRubric, guardrails:agGuardrails, evals:agEvals,

}

function agPassesGate(run){ const g=agState.a.eval_gate||{}; return run && (run.total||0) >= (g.min_cases??10) && Number(run.decision_agreement||0) >= (g.min_agreement??80); }
async function agGateConfirm(what, versionField, versionId){
  if (agState.a.key!=='fit') return confirmBox(`This agent has no evals yet. Activate ${what}?`);

  const prev = () => { $('#rbPrev').textContent = agRubricText(rub) + `\n\nThreshold: ${rub.threshold}`; };
  const tryDraw=()=>{ $('#rbTry').innerHTML = rub.params.filter(p=>p.enabled!==false).map(p=>`<span style="display:inline-flex;gap:4px;align-items:center;margin:0 10px 6px 0"><span class="mono muted">${esc(p.key)}</span><input class="rbT" data-k="${esc(p.key)}" type="number" min="0" max="100" placeholder="?" style="width:62px"></span>`).join('');
    const calc=()=>{ const ps={}; $('#rbTry').querySelectorAll('.rbT').forEach(x=>ps[x.dataset.k]={score:x.value===''?null:Number(x.value)}); const r=agComputeFit(rub, ps); $('#rbTryOut').innerHTML = `Total <b>${r.total??'—'}</b> · ${r.total!=null&&r.total>=Number(rub.threshold)?`<span class="tag ok">${RK==='fit'?'push':'tailor'}</span>`:`<span class="tag">${RK==='fit'?'park':'generic'}</span>`}${r.caps.length?` · capped by ${esc(r.caps.join(', '))}`:''}`; };
    $('#rbTry').querySelectorAll('.rbT').forEach(x=>x.oninput=calc); calc(); };
  const draw = () => {
    const wsum = rub.params.filter(p=>p.enabled!==false).reduce((s,p)=>s+Number(p.weight||0),0)||1;
    $('#rbParams').innerHTML = rub.params.map((p,i)=>`<div class="card" style="margin-bottom:10px" data-i="${i}">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="checkbox" class="rbEn" style="width:auto" ${p.enabled!==false?'checked':''} title="Use this parameter">
        <input class="rbName" value="${esc(p.name)}" style="flex:2;min-width:140px" placeholder="Name">
        <input class="rbKey mono" value="${esc(p.key)}" style="flex:1;min-width:110px" placeholder="key">
        <span class="muted mono">weight</span><input class="rbW" type="number" min="0" value="${p.weight}" style="width:70px">
        <span class="tag ${p.enabled!==false?'new':''} rbShare">${p.enabled!==false?Math.round(100*Number(p.weight||0)/wsum):0}% of score</span>
        <button class="small rbDel" style="margin-left:auto;color:var(--bad)">Remove</button></div>
      <label>Description: what this parameter judges</label><textarea class="rbDesc" style="min-height:40px">${esc(p.description||'')}</textarea>
      <div class="grid2 ag-3"><div><label>Scores about 90 when</label><textarea class="rbHi" style="min-height:52px">${esc(p.anchors?.high||'')}</textarea></div><div><label>About 50 when</label><textarea class="rbMid" style="min-height:52px">${esc(p.anchors?.mid||'')}</textarea></div><div><label>About 10 when</label><textarea class="rbLo" style="min-height:52px">${esc(p.anchors?.low||'')}</textarea></div></div>
      <div class="grid2"><div><label>Hard cap (blank = none)</label><div style="display:flex;gap:6px;align-items:center"><span class="muted">if below</span><input class="rbCb" type="number" value="${p.cap?.below??''}" style="width:70px"><span class="muted">total at most</span><input class="rbCm" type="number" value="${p.cap?.max??''}" style="width:70px"></div></div>
        <div><label>If the AI cannot judge it</label><select class="rbUnk"><option value="neutral" ${p.if_unknown!=='skip'?'selected':''}>Score it 50 (neutral)</option><option value="skip" ${p.if_unknown==='skip'?'selected':''}>Leave it out and re-weight the rest</option></select></div></div>
    </div>`).join('') || '<div class="muted">No parameters.</div>';
    $('#rbParams').querySelectorAll('.card').forEach(c=>{ const i=Number(c.dataset.i), p=rub.params[i];
      const rd=()=>{ p.enabled=c.querySelector('.rbEn').checked; p.name=c.querySelector('.rbName').value; p.key=c.querySelector('.rbKey').value.trim(); p.weight=Number(c.querySelector('.rbW').value||0); p.description=c.querySelector('.rbDesc').value;
        p.anchors={high:c.querySelector('.rbHi').value, mid:c.querySelector('.rbMid').value, low:c.querySelector('.rbLo').value};
        const cb=c.querySelector('.rbCb').value, cm=c.querySelector('.rbCm').value; p.cap = (cb!==''&&cm!=='') ? {below:Number(cb), max:Number(cm)} : null; p.if_unknown=c.querySelector('.rbUnk').value; prev(); };
      c.querySelectorAll('input,textarea,select').forEach(x=>x.addEventListener('input',rd));
      c.querySelectorAll('.rbEn,.rbW,.rbUnk,.rbKey,.rbCb,.rbCm').forEach(x=>x.addEventListener('change',()=>{ rd(); draw(); tryDraw(); }));
      c.querySelector('.rbDel').onclick=()=>{ rub.params.splice(i,1); draw(); prev(); tryDraw(); }; });
  };
  draw(); prev(); tryDraw();
  $('#rbS').onchange=()=>{ agState.rs=$('#rbS').value; agState.rv=null; openAgent(a.id,'rubric'); };
  $('#rbV').onchange=()=>{ agState.rv=$('#rbV').value; openAgent(a.id,'rubric'); };
  $('#rbThr').oninput=()=>{ rub.threshold=Number($('#rbThr').value); prev(); tryDraw(); };
  $('#rbAdd').onclick=()=>{ rub.params.push({key:'param_'+(rub.params.length+1), name:'New parameter', weight:10, enabled:true, description:'', anchors:{high:'',mid:'',low:''}, cap:null, if_unknown:'neutral'}); draw(); prev(); tryDraw(); };
  $('#rbSave').onclick=async()=>{ try{
      const keys=rub.params.map(p=>p.key); if (!rub.params.filter(p=>p.enabled!==false).length) throw new Error('Turn on at least one parameter.');
      if (keys.some(k=>!/^[a-z][a-z0-9_]{1,30}$/.test(k))) throw new Error('Keys must be lowercase letters, digits or _ (e.g. role_level).');
      if (new Set(keys).size!==keys.length) throw new Error('Two parameters share a key.');
      for (const p of rub.params) { if (p.enabled===false) continue; if (!(p.weight>0)) throw new Error(`${p.name}: weight must be above 0.`); if (!p.anchors.high||!p.anchors.mid||!p.anchors.low) throw new Error(`${p.name}: fill all three anchors. They are what the AI scores against.`);
        if (p.cap && (p.cap.max<0||p.cap.max>100||p.cap.below<0||p.cap.below>100)) throw new Error(`${p.name}: cap numbers must be 0–100.`); }
      if (!(rub.threshold>=0&&rub.threshold<=100)) throw new Error('Threshold must be 0–100.');
      if (sel && JSON.stringify(rub)===JSON.stringify(sel.rubric)) throw new Error('No change from v'+sel.version+'.');
      const next=(vs[0]?.version||0)+1; const v=await q(sb.from('fit_rubric_versions').insert({job_stream_id:sid, agent_key:RK, version:next, rubric:rub, notes:$('#rbNotes').value||null}).select().single());
      agState.rv=v.id; toast(`Saved ${RK==='fit'?'fitment':'criteria'} v${next} for ${stream.name} as a draft`); openAgent(a.id,'rubric'); }catch(e){ $('#rbErr').textContent=e.message||e; } };
  if ($('#rbAct')) $('#rbAct').onclick=async()=>{ const ok = RK==='fit' ? await agGateConfirm(`Fitment v${sel.version} (${stream.name})`,'rubric',sel.id) : await confirmBox(`Make criteria v${sel.version} live for ${stream.name}? It is used from the next runner pass; leads already decided keep their answer unless you re-run them.`); if(!ok){ openAgent(a.id,'rubric'); return; }
    try{ await q(sb.from('job_streams').update({[AF]:sel.id}).eq('id',sid)); state.streams = await q(sb.from('job_streams').select('*').order('created_at')); toast(`${RK==='fit'?'Fitment':'Criteria'} v${sel.version} is live for ${stream.name} from the next run`); openAgent(a.id,'rubric'); }catch(e){ err(e); } };
}

async function agGuardrails(a, el){
  const gr = JSON.parse(JSON.stringify(a.guardrails||[]));
  el.innerHTML = `<p class="muted">Locked guardrails are enforced in the runner's code and cannot be switched off here. The others you can tune.</p>
    <table><tbody>${gr.map((g,i)=>`<tr><td style="width:36px">${g.locked?'<span title="Always on">🔒</span>':`<input type="checkbox" class="grOn" data-i="${i}" style="width:auto" ${g.on?'checked':''}>`}</td>
      <td><b>${esc(g.label)}</b><div class="muted" style="font-size:13px">${esc(g.desc)}</div></td>
      <td style="width:170px">${g.value!==undefined?`<input class="grVal" data-i="${i}" type="number" step="any" value="${g.value}" style="width:90px" ${g.locked?'disabled':''}> <span class="muted mono">${esc(g.unit||'')}</span>`:''}</td></tr>`).join('')||'<tr><td class="muted">No guardrails for this agent.</td></tr>'}</tbody></table>
    ${gr.some(g=>!g.locked)?'<div class="actions"><button class="primary" id="grSave">Save</button></div>':''}<div class="err" id="grErr"></div>`;
  if ($('#grSave')) $('#grSave').onclick=async()=>{ try{ el.querySelectorAll('.grOn').forEach(x=>gr[x.dataset.i].on=x.checked); el.querySelectorAll('.grVal').forEach(x=>{ const v=Number(x.value); if (!(v>=0)) throw new Error('Values must be 0 or more.'); gr[x.dataset.i].value=v; });
      await agSave({guardrails:gr}); openAgent(a.id,'guardrails'); }catch(e){ $('#grErr').textContent=e.message||e; } };
}

async function agEvals(a, el){
  const [cases, runs, pvs, rvs] = await Promise.all([
    q(sb.from('agent_evals').select('*').eq('agent_id',a.id).order('created_at')),
    q(sb.from('agent_eval_runs').select('id,status,requested_at,finished_at,prompt_version_id,rubric_version_ids,total,decision_pass,band_pass,decision_agreement,band_agreement,model,error').eq('agent_id',a.id).order('requested_at',{ascending:false}).limit(20)),
    q(sb.from('agent_prompt_versions').select('id,version').eq('agent_id',a.id).order('version',{ascending:false})),
    q(sb.from('fit_rubric_versions').select('id,version,job_stream_id').eq('agent_key','fit').order('version',{ascending:false}))]);
  const g = a.eval_gate||{min_agreement:80,min_cases:10};
  const passes = r => Number(r.decision_agreement)>=(g.min_agreement??80) && (r.total||0)>=(g.min_cases??10);
  const nLab = () => cases.filter(c=>c.is_active && c.expected_band).length;
  const lastDone = runs.find(r=>r.status==='done');
  const lastRes = lastDone ? ((await q(sb.from('agent_eval_runs').select('results').eq('id',lastDone.id).single())).results||[]) : [];
  const pvN = id => (pvs.find(v=>v.id===id)||{}).version, rvN = id => (rvs.find(v=>v.id===id)||{}).version;
  const sn = id => streamName(id)||'—';
  el.innerHTML = `<div class="grid2"><div>
      <h3 style="margin-top:0">How evals work</h3>
      <p style="font-size:13.5px">Each case is a job you label with the band you think it belongs in. An eval run scores every labelled case with the chosen prompt and fitment versions, then compares.
      <b>Decision agreement</b>: the system's push or park matches your label (Strong and Plausible mean push). <b>Band agreement</b>: the score lands inside your band.</p>
      <h3>Gate for going live</h3>
      <div class="grid2"><div><label for="egA">Min decision agreement, %</label><input id="egA" type="number" value="${g.min_agreement??80}"></div><div><label for="egC">Min labelled cases</label><input id="egC" type="number" value="${g.min_cases??10}"></div></div>
      <div class="actions"><button id="egSave">Save gate</button></div>
    </div><div>
      <h3 style="margin-top:0">Queue an eval run</h3>
      <label for="erP">Prompt version</label><select id="erP">${pvs.map(v=>`<option value="${v.id}" ${v.id===a.active_prompt_version_id?'selected':''}>v${v.version}${v.id===a.active_prompt_version_id?' · active':''}</option>`).join('')}</select>
      ${state.streams.map(s=>`<label>Fitment version · ${esc(s.name)}</label><select class="erR" data-s="${s.id}">${rvs.filter(v=>v.job_stream_id===s.id).map(v=>`<option value="${v.id}" ${v.id===s.fit_rubric_version_id?'selected':''}>v${v.version}${v.id===s.fit_rubric_version_id?' · active':''}</option>`).join('')}</select>`).join('')}
      <div class="actions"><button class="primary" id="erGo" ${nLab()?'':'disabled'}>Queue eval run (${nLab()} labelled cases)</button></div>
      <div class="muted" style="font-size:13px">Runs on the runner's next pass (up to 2 hours). Uses about ${Math.max(1,Math.ceil(nLab()/(a.max_items||8)))} AI calls from the same free quota. Unlabelled cases are skipped.</div><div class="err" id="erErr"></div>
    </div></div>
    <h3>Eval runs</h3><div class="tablewrap"><table><thead><tr><th>Requested</th><th>Status</th><th>Prompt</th><th>Fitment</th><th>Cases</th><th>Decision</th><th>Band</th><th>Model</th></tr></thead><tbody>
      ${runs.map(r=>`<tr class="row erRow" data-id="${r.id}"><td>${fmtDT(r.requested_at)}</td><td>${r.status==='done'?'<span class="tag ok">done</span>':r.status==='failed'?`<span class="tag bad" title="${esc(r.error||'')}">failed</span>`:`<span class="tag warn">${esc(r.status)}</span>`}</td>
        <td class="mono">v${pvN(r.prompt_version_id)??'?'}</td><td class="mono">${Object.entries(r.rubric_version_ids||{}).map(([s,id])=>`${esc(sn(s).split(' ')[0])} v${rvN(id)??'?'}`).join(', ')}</td><td>${r.total??''}</td>
        <td>${r.decision_agreement!=null?`<b style="color:${passes(r)?'var(--accent)':'var(--bad)'}">${Math.round(r.decision_agreement)}%</b> (${r.decision_pass}/${r.total})`:''}</td>
        <td>${r.band_agreement!=null?`${Math.round(r.band_agreement)}% (${r.band_pass}/${r.total})`:''}</td><td class="mono muted">${esc(r.model||'')}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No eval runs yet.</td></tr>'}</tbody></table></div>
    <div id="erDetail"></div>
    <h3 id="ecHead"></h3>
    <div class="toolbar"><button id="ecLeads">+ Add new leads</button><button id="ecApps">+ Add from applications</button><button id="ecMan">+ Add by hand</button><span class="grow"></span><select id="ecF" style="width:auto"><option value="unl">Unlabelled first</option><option value="all">All</option><option value="miss">Misses in last run</option></select></div>
    <div class="tablewrap"><table><thead><tr><th>Job</th><th>Stream</th><th>Your label</th><th>Last run</th><th></th></tr></thead><tbody id="ecBody"></tbody></table></div>`;
  const resBy = Object.fromEntries(lastRes.map(r=>[r.case_id, r]));
  const drawCases = () => {
    $('#ecHead').textContent = `Cases · ${nLab()} of ${cases.filter(c=>c.is_active).length} labelled`;
    $('#erGo').textContent = `Queue eval run (${nLab()} labelled cases)`; $('#erGo').disabled = !nLab();
    const f=$('#ecF').value; let list=cases.filter(c=>c.is_active);
    if (f==='unl') list=[...list.filter(c=>!c.expected_band), ...list.filter(c=>c.expected_band)];
    if (f==='miss') list=list.filter(c=>resBy[c.id] && !resBy[c.id].decision_pass);
    $('#ecBody').innerHTML = list.map(c=>{ const r=resBy[c.id], i=c.input||{};
      return `<tr data-id="${c.id}"><td><b>${esc(i.title||'')}</b> · ${esc(i.company||'')}<div class="muted" style="font-size:12.5px">${esc(i.location||'')}${c.note?' · '+esc(c.note):''}</div></td><td class="muted">${esc(sn(c.job_stream_id))}</td>
        <td style="white-space:nowrap">${Object.entries(AG_BANDS).map(([k,b])=>`<span class="chip ecB ${c.expected_band===k?'on':''}" data-b="${k}" title="${b.label}" style="margin:0 2px 2px 0">${k}</span>`).join('')}</td>
        <td>${r?`<span class="fit">${r.got??'—'}</span> ${r.decision_pass?'<span class="tag ok">agrees</span>':'<span class="tag bad">differs</span>'}${r.caps_applied?.length?` <span class="muted mono">cap ${esc(r.caps_applied.join(','))}</span>`:''}`:'<span class="muted">—</span>'}</td>
        <td><button class="small ecX" title="Remove from the eval set">✕</button></td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">No cases.</td></tr>';
    $('#ecBody').querySelectorAll('tr[data-id]').forEach(tr=>{ const c=cases.find(x=>x.id===tr.dataset.id);
      tr.querySelectorAll('.ecB').forEach(ch=>ch.onclick=async()=>{ const b=ch.dataset.b===c.expected_band?null:ch.dataset.b; try{ await q(sb.from('agent_evals').update({expected_band:b, expected_min:b?AG_BANDS[b].min:null, expected_max:b?AG_BANDS[b].max:null}).eq('id',c.id)); c.expected_band=b; drawCases(); }catch(e){ err(e); } });
      tr.querySelector('.ecX').onclick=async()=>{ try{ await q(sb.from('agent_evals').update({is_active:false}).eq('id',c.id)); c.is_active=false; drawCases(); }catch(e){ err(e); } }; });
  };
  drawCases(); $('#ecF').onchange=drawCases;
  $('#egSave').onclick=async()=>{ try{ await agSave({eval_gate:{...g, min_agreement:Number($('#egA').value), min_cases:Number($('#egC').value), metric:'decision'}}, 'Gate saved'); }catch(e){ err(e); } };
  $('#erGo').onclick=async()=>{ try{ const rv={}; el.querySelectorAll('.erR').forEach(s=>{ if (s.value) rv[s.dataset.s]=s.value; });
      if (runs.some(r=>r.status==='queued'||r.status==='running')) { const ok=await confirmBox('An eval run is already waiting. Queue another one?'); if(!ok){ openAgent(a.id,'evals'); return; } }
      await q(sb.from('agent_eval_runs').insert({agent_id:a.id, prompt_version_id:$('#erP').value, rubric_version_ids:rv, status:'queued'})); toast('Queued. It runs on the next runner pass.'); openAgent(a.id,'evals'); }catch(e){ $('#erErr').textContent=e.message||e; } };
  el.querySelectorAll('.erRow').forEach(tr=>tr.onclick=async()=>{ const r=await q(sb.from('agent_eval_runs').select('*').eq('id',tr.dataset.id).single()); const res=(r.results||[]).slice().sort((x,y)=>(Number(!!x.decision_pass)-Number(!!y.decision_pass)));
    $('#erDetail').innerHTML = `<h3>Run of ${fmtDT(r.requested_at)}${r.error?` · <span style="color:var(--bad)">${esc(r.error)}</span>`:''}</h3><div class="tablewrap"><table><thead><tr><th>Job</th><th>Your band</th><th>Score</th><th>Decision</th><th>Band</th><th>Parameters</th><th>Basis / note</th></tr></thead><tbody>
      ${res.map(x=>`<tr><td>${esc(x.title||'')} · ${esc(x.company||'')}</td><td>${esc(x.expected_band||'')}</td><td class="fit">${x.got??'—'}${x.caps_applied?.length?`<div class="muted mono">cap ${esc(x.caps_applied.join(','))}</div>`:''}</td><td>${x.decision_pass?'✓':'<span style="color:var(--bad)">✗</span>'}</td><td>${x.band_pass?'✓':'✗'}</td>
        <td class="mono" style="font-size:11.5px">${Object.entries(x.params||{}).map(([k,v])=>`<div title="${esc(v?.why||'')}">${esc(k)} <b>${v?.score??'null'}</b> <span class="muted">${esc((v?.why||'').slice(0,60))}</span></div>`).join('')}</td><td class="muted" style="font-size:12.5px">${esc(x.basis||'')}${x.note?' · '+esc(x.note):''}${x.error?`<div style="color:var(--bad)">${esc(x.error)}</div>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No results.</td></tr>'}</tbody></table></div>`;
    $('#erDetail').scrollIntoView({behavior:'smooth'}); });
  const addCases = async rows => { if (!rows.length) { toast('Nothing new to add'); return; } await q(sb.from('agent_evals').insert(rows)); toast(`Added ${rows.length} cases`); openAgent(a.id,'evals'); };
  $('#ecLeads').onclick=async()=>{ try{ const have=new Set(cases.map(c=>c.lead_id).filter(Boolean)); const ls=await q(sb.from('leads').select('id,title,company,location,raw_snippet,jd_text,job_stream_id,fit_score').order('created_at',{ascending:false}).limit(200));
      await addCases(ls.filter(l=>!have.has(l.id)).map(l=>({agent_id:a.id, job_stream_id:l.job_stream_id, lead_id:l.id, input:{title:l.title, company:l.company, location:l.location, snippet:l.raw_snippet, jd_text:l.jd_text}, note:'from lead · old score '+(l.fit_score??'none')}))); }catch(e){ err(e); } };
  $('#ecApps').onclick=async()=>{ try{ const have=new Set(cases.map(c=>c.application_id).filter(Boolean)); const as=await q(sb.from('applications').select('id,title,company,location,job_stream_id,status,final_status').order('created_at',{ascending:false}).limit(300));
      await addCases(as.filter(x=>!have.has(x.id)).map(x=>({agent_id:a.id, job_stream_id:x.job_stream_id, application_id:x.id, input:{title:x.title, company:x.company, location:x.location}, note:'from application · '+(x.final_status||x.status)}))); }catch(e){ err(e); } };
  $('#ecMan').onclick=()=>{ openModal(`<h3>New eval case</h3><div class="grid2"><div><label>Title</label><input id="mT"></div><div><label>Company</label><input id="mC"></div><div><label>Location</label><input id="mL"></div><div><label>Stream</label><select id="mS">${state.streams.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div></div>
      <label>Snippet or JD text (optional)</label><textarea id="mJ"></textarea><label>Your band</label><select id="mB">${Object.entries(AG_BANDS).map(([k,b])=>`<option value="${k}">${b.label}</option>`).join('')}</select>
      <div class="actions"><button class="primary" id="mOk">Add</button><button id="mNo">Cancel</button></div><div class="err" id="mErr"></div>`);
    $('#modal').style.maxWidth='';
    $('#mNo').onclick=()=>openAgent(a.id,'evals');
    $('#mOk').onclick=async()=>{ try{ if (!$('#mT').value.trim()) throw new Error('Title is required.'); const b=$('#mB').value;
      await q(sb.from('agent_evals').insert({agent_id:a.id, job_stream_id:$('#mS').value, input:{title:$('#mT').value.trim(), company:$('#mC').value.trim(), location:$('#mL').value.trim(), snippet:null, jd_text:$('#mJ').value.trim()||null}, expected_band:b, expected_min:AG_BANDS[b].min, expected_max:AG_BANDS[b].max, note:'added by hand'}));
      toast('Case added'); openAgent(a.id,'evals'); }catch(e){ $('#mErr').textContent=e.message||e; } }; };
}

  const s = state.settings;
  el.innerHTML = pageHead('Settings', 'How the system behaves, and how it looks') + `<div class="card" style="margin-bottom:16px;max-width:520px"><h4>Appearance</h4><p class="muted" style="font-size:13.5px">System follows your phone or laptop setting. Saved on this browser.</p><div class="seg" id="themeSeg2" role="group" aria-label="Theme"></div></div><div class="grid2" style="gap:0 28px"><div>
    <h3>Decision loop</h3>
    <label for="s_fit">Fit gate (0 to 100): leads at or above this get a push</label><input id="s_fit" type="number" value="${s.fit_threshold??60}">
    <label for="s_fresh">Freshness cutoff, days (older leads are parked)</label><input id="s_fresh" type="number" value="${s.freshness_days??14}">
    <label for="s_cap">Daily cap on push messages</label><input id="s_cap" type="number" value="${s.daily_cap??8}">
    <label>Quiet hours</label><div class="grid2"><input id="s_qf" type="time" value="${esc(s.quiet_hours?.from||'23:00')}"><input id="s_qt" type="time" value="${esc(s.quiet_hours?.to||'07:00')}"></div>
    <label for="s_stale">"Going stale" after N days without a touch</label><input id="s_stale" type="number" value="${s.stale_days??10}">
    <label for="s_ghost">Auto-mark ghosted after N days (reversible)</label><input id="s_ghost" type="number" value="${s.ghost_days??30}">
    <h3>Notification channel</h3>
    <label for="s_ch">Channel</label><select id="s_ch">${['telegram','whatsapp','web_push','email'].map(c=>`<option value="${c}" ${s.channel===c?'selected':''}>${hum(c)}</option>`).join('')}</select>
    <label for="s_tg">Telegram chat id (filled after you message the bot once)</label><input id="s_tg" value="${esc(s.telegram_chat_id||'')}">
    <div class="actions"><button class="primary" id="saveS">Save settings</button></div><div class="err" id="sErr"></div>
  </div><div>
    <h3>Account</h3><p>Signed in as <b>${esc(state.user.email)}</b>. This is the only account that can sign in; other sign-ups are blocked at the database.</p>
    <label for="np">New password (12+ characters)</label><input id="np" type="password" autocomplete="new-password"><label for="np2">Repeat</label><input id="np2" type="password" autocomplete="new-password">
    <div class="actions"><button id="chPw">Change password</button></div><div class="err" id="pwErr"></div>
    <h3>Reference data</h3><p class="muted">Sources / portals and park reasons are editable here.</p><div class="actions"><button id="edBoards">Sources & portals</button><button id="edNoise">Park reasons</button><button id="edCrit">Filter criteria</button></div>
    <h3>About</h3><p class="muted">Job Application Driver v1.0.12 · 25 Oct 2026 · data in Supabase Project Zero, row-level security by owner · design doc v1.7 in PMOS/JobTracker.</p>
  </div></div>`;
  $('#saveS').onclick=async()=>{ try{ const ns={...s, fit_threshold:Number($('#s_fit').value), freshness_days:Number($('#s_fresh').value), daily_cap:Number($('#s_cap').value), quiet_hours:{from:$('#s_qf').value,to:$('#s_qt').value}, stale_days:Number($('#s_stale').value), ghost_days:Number($('#s_ghost').value), channel:$('#s_ch').value, telegram_chat_id:$('#s_tg').value||null}; await q(sb.from('user_settings').upsert({owner_id:state.user.id, settings:ns, updated_at:new Date().toISOString()})); state.settings=ns; toast('Settings saved'); }catch(e){ $('#sErr').textContent=e.message||e; } };
  renderThemeSeg();
  $('#chPw').onclick=async()=>{ const a=$('#np').value,b=$('#np2').value; if (a.length<12) return $('#pwErr').textContent='Use at least 12 characters.'; if (a!==b) return $('#pwErr').textContent='Passwords do not match.'; const {error}=await sb.auth.updateUser({password:a}); if (error) return $('#pwErr').textContent=error.message; $('#np').value=$('#np2').value=''; $('#pwErr').textContent=''; toast('Password changed'); };
  $('#edBoards').onclick=()=>simpleList('job_boards',[{k:'name',label:'Name',t:'text'},{k:'kind',label:'Kind',t:'select',opts:['portal','agency','direct','referral','direct_outreach','career_page']},{k:'base_url',label:'URL',t:'text'},{k:'is_active',label:'Active',t:'bool'}],'name');
  $('#edNoise').onclick=()=>simpleList('noise_reasons',[{k:'reason',label:'Reason',t:'text'}],'reason');
  $('#edCrit').onclick=()=>simpleList('filter_criteria',[streamFk,{k:'criterion_type',label:'Type',t:'select',opts:['title_include','title_exclude','location_allow']},{k:'value',label:'Value',t:'text'},{k:'is_active',label:'Active',t:'bool'}],'value');
}
async function simpleList(table, fields, labelCol){
  const rows = await q(sb.from(table).select('*').order(labelCol));
  openModal(`<h3>${esc(hum(table))}</h3><table><tbody>${rows.map(r=>`<tr class="row" data-id="${r.id}"><td>${esc(r[labelCol])}</td><td class="muted">${esc(hum(r.kind||r.criterion_type||''))}${r.job_stream_id?' · '+esc(streamName(r.job_stream_id)):''}</td><td>${r.is_active===false?'<span class="tag">inactive</span>':''}</td></tr>`).join('')}</tbody></table><div class="actions"><button id="add">+ Add</button><button id="close" class="right">Close</button></div>`);
  const re=()=>simpleList(table,fields,labelCol);
  $('#close').onclick=()=>{ closeModal(); state.boards=[]; };
  $('#add').onclick=()=>editRecord({table,title:'New',fields,row:null,defaults:{is_active:true,job_stream_id:selStreams()[0]||PM_STREAM},after:re});
  $('#modal').querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>editRecord({table,title:'Edit',fields,row:rows.find(r=>r.id===tr.dataset.id),after:re}));
}
</script>
