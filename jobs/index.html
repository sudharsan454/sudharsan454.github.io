<!doctype html>
<!-- Job Application Driver · app v1.0.12 · 25 Oct 2026 · v1.0.12: calm redesign on one design system. Light / Dark / System theme switch (remembered per browser), warm paper and soft charcoal palettes, Inter type, sentence-case labels. Grouped sidebar (Work / Library / System), drawer on phone. Tables rebuilt: company and role in one cell with a quiet meta line (Inbox 12 → 4 columns, Applications 11 → 5), readable status pills, roomy rows, sticky headers. Closed applications (rejected, ghosted, withdrawn) hidden by default on Pipeline and Applications with a one-tap toggle. Lead detail view (fit breakdown as a table, JD, actions) instead of the raw form. Application overview as facts + fit table. Every form keeps every field, grouped into sections with readable option names; raw JSON under Advanced. Target companies as a searchable table. Gentle empty states. v1.0.11: Prep room per interview round (header with company, round, interviewer, countdown to the call, progress; sections Brief, Case files, Mock grill, Numbers, Demo checklist, Ask them), practice mode (question first, 90-second timer, reveal, rate Weak/OK/Strong, weakest first; ratings saved to the database), answer bank redesign (topic chips, search, collapsed answers), pipeline drag and drop plus a Move-to control that open the status dialog pre-set to the new column. Needs migration job_driver_prep_room_v1_0. v1.0.10: agent run log. Every agent card shows a health dot, last run, 24 h success rate and a late flag; each agent gets a Runs tab; the Runs screen lists all runs with health cards, errors by type, filters (date range with quick picks and custom from/to, agent, status, error type, model, backup AI, text) and a run detail (errors per item, leads created, GitHub link). Missed slots are computed from each agent's schedule. Needs runner v1.0.13. v1.0.9: Resume Decider. Inbox gets a Resume column (Generic / Tailor / not yet run / Failed, a ? when the agent is unsure, your override wins); click it for the per-criterion breakdown, override or re-run. Jev's shadow fit score shows under the fit score (J 72). Agents → Resume Decider gets a Criteria tab (same editor as Fitment: weights, descriptions, anchors, threshold = Tailored at or above) and Jev as its model (Gemini backup). Read by runner v1.0.11. v1.0.8: Fitment tab, prompt preview and eval selectors read only fitment rubrics (agent_key = fit); the same table now also holds Resume Decider criteria (runner v1.0.11). v1.0.7: merges two parallel v1.0.5 builds: the JD panel (commit ee35102) and the Agents screen (on/off, schedule, model, versioned prompts, per-stream fitment rubric, guardrails, evals; JD Fetcher card). v1.0.5 (JD): full job description on leads and applications (JD badge in Inbox and Applications, JD panel with source link, paste-by-hand box; runner v1.0.8 fills it). v1.0.4: #app=<id> deep link opens an application (used by Telegram replies from the runner). v1.0.3: login account switched to sudharsan454@gmail.com (all rows re-owned in Supabase, allowlist trigger updated). v1.0.2: boot deferred out of the auth callback (page froze on reload with a saved session). v1.0.1: application detail embed disambiguated (two FKs between applications and leads). v1.0 · 10 Oct 2026 · single-file web app on Supabase (Project Zero) · login: sudharsan454@gmail.com only · changelog at the foot of this file -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Job Application Driver</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>try{var t=localStorage.getItem("jd.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* ===== Design system v1.0.12 · tokens → base → layout → components → screens ===== */
:root{
  --bg:#f5f3ee;--surface:#fffefb;--surface-2:#f1efe9;--fg:#23282a;--fg-2:#3e4547;--muted:#6b7371;--faint:#9aa09d;
  --line:#e6e2da;--line-strong:#d4cfc4;
  --accent:#2f7a6d;--accent-fg:#ffffff;--accent-soft:#e2efeb;--accent-line:#b9d9d0;
  --warn:#94620f;--warn-soft:#f8eedb;--bad:#ad4a3f;--bad-soft:#f7e7e3;--new:#5b4fa0;--new-soft:#ebe8f5;--info:#2e6590;--info-soft:#e3edf6;
  --shadow:0 1px 2px rgba(40,35,25,.05),0 4px 16px rgba(40,35,25,.05);--shadow-lg:0 12px 48px rgba(30,25,15,.18);
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --r-sm:6px;--r:10px;--r-lg:14px;--side:232px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131618;--surface:#1a1e20;--surface-2:#212628;--fg:#e7e5df;--fg-2:#cbc8c1;--muted:#979e9a;--faint:#6d7471;
  --line:#2b3134;--line-strong:#394144;
  --accent:#6dc1ae;--accent-fg:#0e1a17;--accent-soft:#1b332e;--accent-line:#2c5850;
  --warn:#e2ae5e;--warn-soft:#332814;--bad:#e8968b;--bad-soft:#3a211d;--new:#b6abee;--new-soft:#2a2543;--info:#8fbbe2;--info-soft:#1c2b39;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 16px 56px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131618;--surface:#1a1e20;--surface-2:#212628;--fg:#e7e5df;--fg-2:#cbc8c1;--muted:#979e9a;--faint:#6d7471;
  --line:#2b3134;--line-strong:#394144;
  --accent:#6dc1ae;--accent-fg:#0e1a17;--accent-soft:#1b332e;--accent-line:#2c5850;
  --warn:#e2ae5e;--warn-soft:#332814;--bad:#e8968b;--bad-soft:#3a211d;--new:#b6abee;--new-soft:#2a2543;--info:#8fbbe2;--info-soft:#1c2b39;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 16px 56px rgba(0,0,0,.55);color-scheme:dark}

/* base */
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";transition:background .2s,color .2s}
a{color:var(--accent);text-underline-offset:2px}
h2{font-size:1.4rem;font-weight:600;letter-spacing:-.01em;margin:0 0 4px}
h3{font-size:1.02rem;font-weight:600;margin:24px 0 10px}
h4{font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.mono{font-family:var(--mono);font-size:12.5px}
.mono.muted{font-family:var(--body);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
::selection{background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* controls */
button,.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:var(--r-sm);cursor:pointer;line-height:1.3;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,color .15s}
button:hover,.btn:hover{background:var(--surface-2);border-color:var(--faint)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.primary:hover{filter:brightness(1.06);background:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{background:var(--surface-2);color:var(--fg)}
button.small,.btn.small{padding:4px 10px;font-size:13px}
button.danger{color:var(--bad)}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;font-size:14.5px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:8px 10px;border-radius:var(--r-sm);width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[readonly]{background:var(--surface-2);color:var(--muted)}
textarea{min-height:90px;resize:vertical;line-height:1.5}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
label{display:block;font-size:13px;font-weight:500;color:var(--fg-2);margin:14px 0 5px}
button:focus-visible,.btn:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* layout: sidebar + content */
.app{display:none;min-height:100vh}
.app.on{display:grid;grid-template-columns:var(--side) minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:14px}
.brand{font-weight:600;font-size:15px;padding:0 10px;display:flex;align-items:center;gap:9px}
.brand .logo{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:13px;font-weight:700}
.brand small{display:block;font-weight:400;color:var(--faint);font-size:11.5px}
nav{display:flex;flex-direction:column;gap:2px}
.navgroup{font-size:11.5px;font-weight:500;color:var(--faint);padding:12px 10px 4px;letter-spacing:.02em}
nav button{border:none;background:none;justify-content:flex-start;padding:7px 10px;border-radius:8px;color:var(--fg-2);font-weight:450;width:100%}
nav button:hover{background:var(--surface-2);color:var(--fg)}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:550}
nav button .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
nav button.active .cnt{color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 4px}
.side-label{font-size:11.5px;color:var(--faint);padding:0 6px}
.streams{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;border:none;background:none;padding:5px 6px;font-size:12.5px;color:var(--muted);border-radius:6px;justify-content:center}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.mobilebar{display:none}
.scrim{display:none}
.content{min-width:0}
main{padding:28px 36px 64px;max-width:1240px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head .sub{color:var(--muted);font-size:14px;margin-top:2px}
.page-head .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:900px){
  .app.on{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(84vw,300px);z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  .app.nav-open .side{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .app.nav-open .scrim{display:block}
  .mobilebar{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
  .mobilebar b{font-weight:600}
  main{padding:18px 16px 56px}
  .hide-sm{display:none!important}
}

/* toolbar, chips, tags, pills */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:180px}
.toolbar .right{margin-left:auto}
.search{position:relative}
.chip{border:1px solid var(--line-strong);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;user-select:none;color:var(--fg-2);background:var(--surface);transition:all .15s}
.chip:hover{border-color:var(--faint)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted);line-height:1.6;vertical-align:middle}
.tag.ok{background:var(--accent-soft);color:var(--accent)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.new{background:var(--new-soft);color:var(--new)}.tag.info{background:var(--info-soft);color:var(--info)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--fg-2)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pc,var(--faint));flex:none}
.p-applied{--pc:var(--info)}.p-screening{--pc:var(--new)}.p-round{--pc:var(--new)}.p-offer{--pc:var(--accent)}.p-rejected{--pc:var(--bad)}.p-closed{--pc:var(--faint)}
.segtabs{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.segtabs button{border:none;background:none;padding:5px 12px;font-size:13.5px;color:var(--muted);border-radius:7px}
.segtabs button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.segtabs button .muted{font-weight:400;margin-left:4px}

/* tables: calm, readable */
.tablewrap,.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14.5px}
th,td{text-align:left;vertical-align:middle;padding:12px 14px;border-bottom:1px solid var(--line)}
th{font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:1;padding-top:10px;padding-bottom:10px}
tbody tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
td.nowrap{white-space:nowrap}
tr.row{cursor:pointer;transition:background .12s}
tr.row:hover td{background:var(--surface-2)}
.cell-main{font-weight:550;color:var(--fg);line-height:1.35}
.cell-sub{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.cell-sub>.it:not(:last-child)::after,.kcard .m>.it:not(:last-child)::after{content:"·";margin-left:8px;color:var(--faint)}
td .clip{max-width:420px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{padding:36px 16px!important;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg-2);font-weight:550;margin-bottom:4px}
.rowacts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.rowacts .spacer{width:34px;flex:none}
/* tables inside modals and cards stay light */
.modal table,.card table{font-size:14px}
.modal th,.card th{background:transparent;position:static}
.modal td,.modal th,.card td,.card th{padding:9px 10px}

/* score */
.fit{font-family:var(--mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.score{display:inline-grid;place-items:center;min-width:38px;height:28px;padding:0 6px;border-radius:8px;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;background:var(--surface-2);color:var(--muted)}
.score.hi{background:var(--accent-soft);color:var(--accent)}.score.mid{background:var(--warn-soft);color:var(--warn)}

/* cards, kpis */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.card h4{margin:0 0 6px;font-size:15px}
.card.click{cursor:pointer;transition:border-color .15s,transform .15s}
.card.click:hover{border-color:var(--accent-line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:1.5rem;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi span{color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--accent);opacity:.8;min-width:3px}
.bars td{border:none;padding:5px 10px}

/* facts (definition list) */
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px 20px;margin:6px 0 4px}
.facts dt{font-size:12.5px;color:var(--muted);margin:0 0 2px}
.facts dd{margin:0;font-size:14.5px;color:var(--fg)}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(165px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface-2);border:1px solid transparent;border-radius:var(--r);padding:10px;min-height:140px;transition:background .15s,border-color .15s}
.col h4{margin:2px 4px 10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--fg-2)}
.col h4 .muted{font-weight:400;margin-left:auto}
.col .none{font-size:13px;color:var(--faint);padding:8px 4px}
.kcard{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:var(--surface);box-shadow:var(--shadow);transition:border-color .15s}
.kcard:hover{border-color:var(--accent-line)}
.kcard b{font-weight:600}
.kcard .t{font-size:13.5px;color:var(--fg-2);margin-top:1px;line-height:1.4}
.kcard .m{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:2px 8px}
.kcard .tag{margin-top:8px;white-space:normal;border-radius:7px;line-height:1.45;padding:3px 8px}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.kcard[draggable=true]{cursor:grab}.kcard.dragging{opacity:.45}
.kcard select{margin-top:8px;font-size:12.5px;padding:4px 6px}
@media (hover:hover) and (pointer:fine){.kcard select{display:none}}

/* modal / sheet */
.modal-bg{position:fixed;inset:0;background:rgba(15,18,20,.42);backdrop-filter:blur(2px);display:none;z-index:40;align-items:flex-start;justify-content:center;overflow:auto;padding:5vh 16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);max-width:880px;width:100%;padding:22px 26px 20px;margin:auto 0;box-shadow:var(--shadow-lg)}
.modal h3{margin:0 0 6px;font-size:1.15rem}
@media (max-width:640px){.modal-bg{padding:0}.modal{border-radius:0;min-height:100vh;padding:18px 16px}}
.form-sec{margin-top:18px;padding-top:4px}
.form-sec>h5{font-size:13px;font-weight:600;color:var(--fg);margin:0 0 -4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.form-sec details>summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grid2>.wide{grid-column:1/-1}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.ro{padding:8px 0;font-size:14.5px;color:var(--fg-2);min-height:38px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;align-items:center}
.actions .right{margin-left:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;display:none;max-width:90vw;font-size:14px;box-shadow:var(--shadow-lg)}
.err{color:var(--bad);font-size:13.5px;margin-top:8px;min-height:1em}

/* login */
.login{max-width:380px;margin:14vh auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;box-shadow:var(--shadow)}
.login h1{font-size:1.3rem;margin:0 0 4px;font-weight:600}

/* tabs, callouts, text */
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:12px 0 16px}
.tabs button{border:none;background:none;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:8px 12px;margin-bottom:-1px}
.tabs button:hover{color:var(--fg);background:none}
.tabs button.active{border-bottom-color:var(--accent);color:var(--fg)}
.callout{border:1px solid var(--accent-line);background:var(--accent-soft);padding:11px 14px;margin:10px 0;border-radius:var(--r-sm);font-size:14px;color:var(--fg-2)}
.callout.warn{border-color:transparent;background:var(--warn-soft)}
pre.text{white-space:pre-wrap;font-family:var(--body);font-size:14px;line-height:1.6;background:var(--surface-2);border:1px solid var(--line);padding:12px 14px;border-radius:var(--r-sm);max-height:380px;overflow:auto;margin:0}
.reading{max-width:72ch}

/* agents */
.ag-split{display:grid;grid-template-columns:3fr 2fr;gap:0 20px}.ag-split>*{min-width:0}
.grid2.ag-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.ag-split,.grid2.ag-3{grid-template-columns:1fr}}

/* prep room, practice, bank */
.room-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:end;padding-bottom:14px;border-bottom:1px solid var(--line)}
.room-head h2{margin:2px 0 0}
.count{font-size:1.7rem;font-weight:600;font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.count small{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
.pbar{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.room{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;margin-top:16px}
.rail{display:flex;flex-direction:column;gap:2px}
.rail button{border:none;background:none;justify-content:space-between;padding:8px 10px;border-radius:8px;color:var(--fg-2);font-weight:450}
.rail button span{font-size:12.5px;color:var(--muted)}
.rail button.active{background:var(--accent-soft);color:var(--accent);font-weight:550}
@media(max-width:760px){.room{grid-template-columns:1fr}.rail{flex-direction:row;flex-wrap:wrap}}
.prow{border:1px solid var(--line);border-radius:var(--r);margin:8px 0;background:var(--surface);max-width:880px;box-shadow:var(--shadow)}
.prow>button.pq2{width:100%;border:none;background:none;text-align:left;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 15px;font-weight:400}
.prow>button.pq2:hover{background:none}
.prow .pq2 b{font-weight:550}
.prow .meta{font-size:13px;color:var(--muted);grid-column:1}
.prow .pa{padding:0 15px 14px;max-width:72ch;font-size:15px;line-height:1.65}
.dots{display:flex;gap:4px;align-items:center}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line-strong)}.dots i.on{background:var(--accent)}
.practice{max-width:720px}.practice h3{font-size:1.2rem;line-height:1.45;margin:8px 0 12px}
.timer{font-family:var(--mono);font-size:1.3rem;font-variant-numeric:tabular-nums}.timer.late{color:var(--bad)}
.bank details{border:1px solid var(--line);border-radius:var(--r);margin:8px 0;background:var(--surface);max-width:880px;box-shadow:var(--shadow)}
.bank summary{cursor:pointer;padding:12px 15px;font-weight:500;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bank details .body{padding:0 15px 14px;max-width:72ch;line-height:1.65;white-space:pre-wrap}
.room-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.room-list .card{cursor:pointer}.room-list .card:hover{border-color:var(--accent-line)}

/* phone: table rows become stacked cards */
@media (max-width:640px){
  .tablewrap table,.tablewrap tbody{display:block}
  .tablewrap thead{display:none}
  .tablewrap tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:13px 14px;border-bottom:1px solid var(--line)}
  .tablewrap tbody tr:last-child{border-bottom:none}
  .tablewrap td{display:block;border:none;padding:0;text-align:left}
  .tablewrap td:has(.cell-main){flex:1 1 calc(100% - 70px);min-width:0}
  .tablewrap td.r{text-align:left}
  .tablewrap td.empty{flex:1 1 100%}
  .tablewrap tr.row:hover td{background:none}
  .cell-sub{font-size:12.5px}
}
</style>

<body>

<div id="login" class="login">
  <h1>Job Application Driver</h1>
  <div class="muted" style="margin-bottom:6px">Your job search, in one calm place.</div>
  <form id="loginForm">
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" value="sudharsan454@gmail.com">
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
    <div class="actions"><button class="primary" type="submit" id="loginBtn">Sign in</button></div>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">J</span><div>Job Driver<small>v1.0.12</small></div></div>

      <div class="side-label">Streams</div><div class="streams" id="streamChips"></div>

    </div>

</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===================== config ===================== */
const SUPABASE_URL = 'https://bxzmneeacjjtwmtdsrjd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dcwUfURxdPF8AquVEs7KzA_xpcJQR1b'; // publishable key: safe in the browser; RLS does the isolation
const ALLOWED_EMAIL = 'sudharsan454@gmail.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PM_STREAM = '11111111-1111-4111-8111-000000000001';

/* ===================== small helpers ===================== */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => d ? new Date(d).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'2-digit'}) : '';
const fmtDT = d => d ? new Date(d).toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
const daysAgo = d => d ? Math.floor((Date.now() - new Date(d)) / 86400000) : null;
const HUM = {round_1:'Round 1',round_2:'Round 2',round_3:'Round 3',easy_apply:'Easy apply',fit_checked:'Scored',posting_closed:'Posting closed',not_run:'Not yet run',hiring_manager:'Hiring manager',case_file:'Case file',ask_them:'Ask them',portal_alert:'Portal alert',saved_search:'Saved search',email_subscription:'Email subscription',email_received:'Email date',fetch_failed:'Fetch failed',snippet_only:'Snippet only',agent_draft:'Agent draft',title_include:'Title include',title_exclude:'Title exclude',location_allow:'Location allow',in_conversation:'In conversation',from_interview:'From interview',hand_written:'Hand written',web_push:'Web push',cover_letter:'Cover letter',direct_outreach:'Direct outreach',career_page:'Career page',no_reply:'No reply',hr:'HR',jd:'Job description'};
const hum = v => v==null||v==='' ? '' : (HUM[v] || String(v).replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()));
const CLOSED = ['rejected','withdrawn','ghosted'];
const isClosedApp = a => CLOSED.includes(a.status) || ['rejected','withdrawn','ghosted','posting_closed'].includes(a.final_status);
function pill(st, fin){ const v = fin && fin!=='open' && fin!==st ? fin : st; const c = v==='applied'?'p-applied':v==='screening'?'p-screening':/^round/.test(v||'')?'p-round':v==='offer'?'p-offer':v==='rejected'?'p-rejected':'p-closed'; return `<span class="pill ${c}">${esc(hum(v)||'—')}</span>`; }
function scoreBadge(v, thr){ if (v==null) return '<span class="score" title="Not scored yet">–</span>'; const n=Math.round(v); return `<span class="score ${n>=thr?'hi':n>=thr-15?'mid':''}">${n}</span>`; }
const sub = parts => parts.filter(Boolean).map(p=>`<span class="it">${p}</span>`).join('');
function emptyRow(cols, title, hint){ return `<tr><td colspan="${cols}" class="empty"><b>${esc(title)}</b>${hint?esc(hint):''}</td></tr>`; }
function pageHead(title, subtxt, right){ return `<div class="page-head"><div><h2>${title}</h2>${subtxt?`<div class="sub">${subtxt}</div>`:''}</div>${right?`<div class="right">${right}</div>`:''}</div>`; }
function fitTable(fb){
  if (!fb) return '';
  if (typeof fb==='string') return `<pre class="text">${esc(fb)}</pre>`;
  const ps = fb.params || {};
  const rows = Object.entries(ps).map(([k,p])=>{ const sc = p && typeof p==='object' ? p.score : p; const why = p && typeof p==='object' ? (p.why||'') : '';
    return `<tr><td class="nowrap">${esc(hum(k))}</td><td class="r">${sc==null?'<span class="muted">can’t judge</span>':`<b class="num" style="font-weight:600">${esc(sc)}</b>`}</td><td class="muted">${esc(why)}</td></tr>`; }).join('');
  const meta = sub([fb.basis?'scored on '+esc(hum(fb.basis).toLowerCase()):'', fb.model?esc(fb.model):'', (fb.caps_applied||[]).length?'capped by '+esc(fb.caps_applied.map(hum).join(', ')):'']);
  if (!rows) return `<pre class="text">${esc(JSON.stringify(fb,null,1))}</pre>`;
  return `${fb.note?`<p>${esc(fb.note)}</p>`:''}<table><thead><tr><th>Parameter</th><th class="r">Score</th><th>Why</th></tr></thead><tbody>${rows}</tbody></table>${meta?`<div class="cell-sub" style="margin-top:6px">${meta}</div>`:''}`;
}
function themeGet(){ try { return localStorage.getItem('jd.theme')||'system'; } catch(e){ return 'system'; } }
function themeSet(t){ try { localStorage.setItem('jd.theme', t); } catch(e){} if (t==='system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t; renderThemeSeg(); }
function renderThemeSeg(){ const t=themeGet(); ['#themeSeg','#themeSeg2'].forEach(id=>{ const el=$(id); if(!el) return; el.innerHTML=[['light','Light'],['dark','Dark'],['system','System']].map(([k,l])=>`<button class="${t===k?'on':''}" data-t="${k}" aria-pressed="${t===k}">${l}</button>`).join(''); el.querySelectorAll('button').forEach(b=>b.onclick=()=>themeSet(b.dataset.t)); }); }
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none', 2600); }
function err(e){ console.error(e); toast('Error: ' + (e.message || e)); }
async function q(p){ const {data, error} = await p; if (error) throw error; return data; }

/* ===================== state ===================== */
const state = { user:null, streams:[], selected:new Set(), settings:{}, screen:'inbox', boards:[], noise:[], cache:{} };
function selStreams(){ return [...state.selected]; }
function streamName(id){ return (state.streams.find(s=>s.id===id)||{}).name || ''; }
function inStreams(qb, col='job_stream_id'){ const ids=selStreams(); return ids.length && ids.length < state.streams.length ? qb.in(col, ids) : qb; }

/* ===================== auth ===================== */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#loginErr').textContent=''; $('#loginBtn').disabled=true;
  const email = $('#email').value.trim().toLowerCase(), password = $('#password').value;
  if (email !== ALLOWED_EMAIL) { $('#loginErr').textContent = 'This app has one account: ' + ALLOWED_EMAIL; $('#loginBtn').disabled=false; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('#loginBtn').disabled=false;
  if (error) { $('#loginErr').textContent = error.message; return; }
});
$('#logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); });
// Never await Supabase calls inside this callback: supabase-js holds the auth lock while it runs, and a query
// that needs the token would wait for the same lock (page froze on reload in v1.0.1). Defer with setTimeout.
let booted = false;
sb.auth.onAuthStateChange((ev, session) => {
  setTimeout(async () => {
    if (session && session.user && session.user.email?.toLowerCase() === ALLOWED_EMAIL) { state.user = session.user; if (!booted) { booted = true; try { await boot(); } catch(e) { booted = false; err(e); } } }
    else if (session && session.user) { await sb.auth.signOut(); $('#loginErr').textContent='Not an allowed account.'; }
    else { booted = false; state.user=null; $('#app').classList.remove('on'); $('#login').style.display='block'; }
  }, 0);
});

async function boot(){
  $('#login').style.display='none'; $('#app').classList.add('on'); renderThemeSeg();
  $('#menuBtn').onclick=()=>$('#app').classList.add('nav-open'); $('#scrim').onclick=()=>$('#app').classList.remove('nav-open');
  state.streams = await q(sb.from('job_streams').select('*').order('created_at'));
  try { const saved = JSON.parse(localStorage.getItem('jd.streams')||'null'); if (saved) saved.forEach(id=>state.selected.add(id)); } catch(e){}
  if (!state.selected.size) state.streams.forEach(s=>state.selected.add(s.id));
  state.boards = await q(sb.from('job_boards').select('*').order('name'));
  state.noise = await q(sb.from('noise_reasons').select('*').order('reason'));
  const st = await q(sb.from('user_settings').select('*').maybeSingle()); state.settings = (st && st.settings) || {};
  renderNav(); renderChips();
  const hash = location.hash.replace('#','') || 'inbox';
  if (hash.startsWith('app=')) { await go('pipeline'); openApplication(hash.slice(4)); return; }
  go(SCREENS[hash] ? hash : 'inbox');
}

/* ===================== navigation ===================== */
const SCREENS = {
  inbox:{label:'Inbox', g:'work', render:renderInbox},
  pipeline:{label:'Pipeline', g:'work', render:renderPipeline},
  applications:{label:'Applications', g:'work', render:renderApplications},
  interviews:{label:'Interviews', g:'work', render:renderInterviews},
  prep:{label:'Prep', g:'work', render:renderPrep},
  targets:{label:'Target companies', g:'library', render:renderTargets},
  streams:{label:'Streams', g:'library', render:renderStreams},
  resumes:{label:'Resumes', g:'library', render:renderResumes},
  people:{label:'People', g:'library', render:renderPeople},
  numbers:{label:'Numbers', g:'library', render:renderNumbers},
  agents:{label:'Agents', g:'system', render:renderAgents},
  runs:{label:'Runs', g:'system', render:renderRuns},
  settings:{label:'Settings', g:'system', render:renderSettings},
};
const NAV_GROUPS = [['work','Work'],['library','Library'],['system','System']];
function renderNav(){
  const c = state.counts||{};
  $('#nav').innerHTML = NAV_GROUPS.map(([g,l])=>`<div class="navgroup">${l}</div>`+Object.entries(SCREENS).filter(([,v])=>v.g===g).map(([k,v])=>`<button data-s="${k}" class="${k===state.screen?'active':''}" ${k===state.screen?'aria-current="page"':''}>${v.label}${c[k]?`<span class="cnt">${c[k]}</span>`:''}</button>`).join('')).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{ $('#app').classList.remove('nav-open'); go(b.dataset.s); });
  const mt=$('#mbTitle'); if (mt) mt.textContent = SCREENS[state.screen]?.label || '';
}
function renderChips(){ $('#streamChips').innerHTML = state.streams.map(s=>`<span class="chip ${state.selected.has(s.id)?'on':''}" data-id="${s.id}" role="button" tabindex="0" aria-pressed="${state.selected.has(s.id)}">${esc(s.name)}</span>`).join(''); $('#streamChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ const id=c.dataset.id; if (state.selected.has(id)) { if (state.selected.size>1) state.selected.delete(id); } else state.selected.add(id); localStorage.setItem('jd.streams', JSON.stringify([...state.selected])); renderChips(); go(state.screen); }); }
async function go(s){ state.screen=s; location.hash=s; renderNav(); if ($('#modalBg').style.display==='flex') closeModal(); $('#main').innerHTML='<div class="muted" style="padding:24px 0">Loading…</div>'; window.scrollTo(0,0); try { await SCREENS[s].render($('#main')); } catch(e){ err(e); $('#main').innerHTML='<div class="err">'+esc(e.message||e)+'</div>'; } }
window.addEventListener('hashchange', ()=>{ const h=location.hash.replace('#',''); if (h.startsWith('app=')) { openApplication(h.slice(4)); return; } if (SCREENS[h] && h!==state.screen) go(h); });

/* ===================== generic form engine ===================== */
// field: {k, label, t:'text|textarea|number|date|datetime|bool|select|fk|array|json', opts:[], fk:{table,label}, ro:true}
async function fkOptions(fk){ const key='fk:'+fk.table; if (!state.cache[key]) state.cache[key] = await q(sb.from(fk.table).select('id,'+fk.label).order(fk.label)); return state.cache[key]; }
async function fieldHtml(f, v){
  const id='f_'+f.k; const val = v==null?'':v;
  if (f.t==='textarea'||f.t==='json') return `<label for="${id}">${esc(f.label)}</label><textarea id="${id}" ${f.ro?'readonly':''}>${esc(f.t==='json'&&val!==''?JSON.stringify(val,null,1):val)}</textarea>`;
  if (f.t==='bool') return `<label for="${id}">${esc(f.label)}</label><select id="${id}"><option value="">—</option><option value="true" ${val===true?'selected':''}>Yes</option><option value="false" ${val===false?'selected':''}>No</option></select>`;
  if (f.t==='select') return `<label for="${id}">${esc(f.label)}</label><select id="${id}"><option value="">—</option>${f.opts.map(o=>`<option value="${esc(o)}" ${o===val?'selected':''}>${esc(hum(o))}</option>`).join('')}${val&&!f.opts.includes(val)?`<option value="${esc(val)}" selected>${esc(hum(val))}</option>`:''}</select>`;
  if (f.t==='fk'){ const opts=await fkOptions(f.fk); return `<label for="${id}">${esc(f.label)}</label><select id="${id}"><option value="">—</option>${opts.map(o=>`<option value="${o.id}" ${o.id===val?'selected':''}>${esc(o[f.fk.label])}</option>`).join('')}</select>`; }
  if (f.t==='array') return `<label for="${id}">${esc(f.label)} <span style="text-transform:none">(comma separated)</span></label><input id="${id}" value="${esc(Array.isArray(val)?val.join(', '):val)}">`;
  const type = f.t==='number'?'number':f.t==='date'?'date':f.t==='datetime'?'datetime-local':'text';
  let sv = val; if (f.t==='datetime' && val) sv = new Date(val).toISOString().slice(0,16);
  return `<label for="${id}">${esc(f.label)}</label><input id="${id}" type="${type}" value="${esc(sv)}" ${f.ro?'readonly':''}>`;
}
function readField(f){
  const el=$('#f_'+f.k); if(!el) return undefined; let v=el.value;
  if (f.t==='number') return v===''?null:Number(v);
  if (f.t==='bool') return v===''?null:v==='true';
  if (f.t==='array') return v.trim()===''?null:v.split(',').map(s=>s.trim()).filter(Boolean);
  if (f.t==='json') { if (v.trim()==='') return null; try { return JSON.parse(v); } catch(e){ throw new Error('Invalid JSON in '+f.label); } }
  if (f.t==='datetime') return v===''?null:new Date(v).toISOString();
  return v===''?null:v;
}
function openModal(html){ $('#modal').innerHTML=html; $('#modalBg').style.display='flex'; }
function closeModal(){ $('#modalBg').style.display='none'; $('#modal').innerHTML=''; }
$('#modalBg').addEventListener('click', e=>{ if (e.target===$('#modalBg')) closeModal(); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeModal(); });

// Generic editor: table, fields, row (null = new), after(saved) callback, extra html
async function editRecord({table, title, fields, row, defaults={}, after, extra='', canDelete=true}){
  const order=[], byG={};
  for (const f of fields){ const g=f.g||''; if (!(g in byG)) { byG[g]=[]; order.push(g); } byG[g].push(f); }
  let body='';
  for (const g of order){ const parts=[]; for (const f of byG[g]) parts.push(`<div class="${f.t==='textarea'||f.t==='json'?'wide':''}">${await fieldHtml(f, row ? row[f.k] : (defaults[f.k] ?? null))}</div>`);
    const grid=`<div class="grid2">${parts.join('')}</div>`;
    body += g==='Advanced' ? `<div class="form-sec"><details><summary>Advanced (raw data)</summary>${grid}</details></div>` : g ? `<div class="form-sec"><h5>${esc(g)}</h5>${grid}</div>` : grid; }
  openModal(`<h3>${esc(title)}</h3>${body}${extra}
    <div class="actions"><button class="primary" id="saveBtn">Save</button><button id="cancelBtn">Cancel</button>${row&&canDelete?'<button class="right danger ghost" id="delBtn">Delete</button>':''}</div><div class="err" id="formErr"></div>`);
  $('#cancelBtn').onclick=closeModal;
  $('#saveBtn').onclick=async()=>{ try{ const payload={}; for (const f of fields){ if (f.ro) continue; const v=readField(f); if (v!==undefined) payload[f.k]=v; } Object.assign(payload, defaults._force||{});
      let saved; if (row) saved = await q(sb.from(table).update(payload).eq('id', row.id).select().single()); else saved = await q(sb.from(table).insert(payload).select().single());
      state.cache={}; closeModal(); toast('Saved'); if (after) await after(saved); } catch(e){ $('#formErr').textContent=e.message||e; } };
  if (row&&canDelete) $('#delBtn').onclick=async()=>{ const ok=await confirmBox('Delete this record? This cannot be undone.'); if(!ok) return; try{ await q(sb.from(table).delete().eq('id', row.id)); state.cache={}; closeModal(); toast('Deleted'); if (after) await after(null);}catch(e){ $('#formErr').textContent=e.message||e; } };
}
function confirmBox(msg){ return new Promise(res=>{ const prev=$('#modal').innerHTML; openModal(`<h3>Are you sure?</h3><p class="reading">${esc(msg)}</p><div class="actions"><button class="primary" id="okBtn">Yes</button><button id="noBtn">No</button></div>`); $('#okBtn').onclick=()=>{ closeModal(); res(true); }; $('#noBtn').onclick=()=>{ $('#modal').innerHTML=prev; res(false); }; }); }

/* ===================== JD badge (v1.0.5) ===================== */
function jdTag(text, conf){ if (text && conf==='partial') return '<span class="tag warn" title="Part of the job description">Partial JD</span>'; if (text) return '<span class="tag ok" title="Full job description saved">JD saved</span>'; if (conf==='fetch_failed') return '<span class="tag" title="Could not fetch it; you can paste it by hand">No JD</span>'; return '<span class="tag" title="Waiting for the runner">JD coming</span>'; }
/* ===================== field sets ===================== */
const streamFk = {k:'job_stream_id', label:'Stream', t:'fk', fk:{table:'job_streams', label:'name'}};
const boardFk = {k:'job_board_id', label:'Source / portal', t:'fk', fk:{table:'job_boards', label:'name'}};

const normCo = s => (s||'').toLowerCase().replace(/\b(pvt|private|ltd|limited|inc|llc|llp|technologies|technology|solutions|systems|labs)\b\.?/g,'').replace(/[^a-z0-9]+/g,' ').trim();

// ---- Resume Decider (app v1.0.8): picklist generic | tailored | not_run | failed; your override wins
const RD_LABEL = {generic:'Generic', tailored:'Tailor', not_run:'Not yet run', failed:'Failed'};
function rdValue(l){ return l.resume_override || l.resume_decision || 'not_run'; }
function rdTag(l){
  const v = rdValue(l), cls = v==='generic'?'ok':v==='tailored'?'warn':v==='failed'?'bad':'';
  const t = l.resume_override ? 'your call' : v==='failed' ? (l.resume_error||'failed') : v==='not_run' ? (l.resume_error?('last try: '+l.resume_error):'waits for the next runner pass (only leads at or above the fit gate)') : `score ${l.resume_score??'?'} · ${l.resume_engine||''}${l.resume_low_confidence?' · unsure':''}`;
  return `<span class="tag ${cls} rd" data-id="${l.id}" style="cursor:pointer" title="${esc(t)}">${RD_LABEL[v]||v}${l.resume_low_confidence&&!l.resume_override?' ?':''}${l.resume_override?' ✎':''}</span>`;
}
async function rdOpen(l){
  const b = l.resume_breakdown || {}, ps = b.params || {};
  const rows = Object.entries(ps).map(([k,p])=>`<tr><td class="mono">${esc(k)}</td><td>${p.score==null?'<span class="muted">cannot judge</span>':p.score}</td><td class="muted">${esc(p.why||'')}</td></tr>`).join('');
  const d = b.direct || {};
  openModal(`<h3>Resume: ${esc(l.title)} at ${esc(l.company)}</h3>
    <p>Agent says <b>${RD_LABEL[l.resume_decision]||l.resume_decision}</b>${l.resume_score!=null?` · score ${l.resume_score} (Tailored at or above ${b.threshold??'?'})`:''}${l.resume_engine?` · ${esc(l.resume_engine)}`:''}${l.resume_low_confidence?' · <span class="tag warn">unsure, your call</span>':''}${l.resume_override?` · your override: <b>${RD_LABEL[l.resume_override]}</b>`:''}</p>
    ${l.resume_reason?`<p class="muted">${esc(l.resume_reason)}</p>`:''}
    ${l.resume_error?`<div class="callout warn">Last error (try ${l.resume_attempts||0} of 3): ${esc(l.resume_error)}</div>`:''}
    ${rows?`<table><thead><tr><th>Criterion</th><th>Score</th><th>Why</th></tr></thead><tbody>${rows}</tbody></table>`:'<p class="muted">No breakdown yet.</p>'}
    ${d.choice?`<p class="muted" style="font-size:13px">Jev's direct answer: ${esc(d.choice)}${d.probabilities&&d.probabilities[d.choice]!=null?` (p=${Number(d.probabilities[d.choice]).toFixed(2)})`:''}${b.career_notes===false?' · no career notes yet, so "underplayed experience" was left out':''}</p>`:''}
    <div class="actions"><button class="primary" id="rdG">Set Generic</button><button id="rdT">Set Tailor</button>${l.resume_override?'<button id="rdC">Clear my override</button>':''}<button id="rdR">Re-run on next pass</button><button id="rdX">Close</button></div><div class="err" id="rdE"></div>`);
  const upd = async (patch, msg) => { try { await q(sb.from('leads').update(patch).eq('id',l.id)); closeModal(); toast(msg); go(state.screen||'inbox'); } catch(e){ $('#rdE').textContent=e.message||e; } };
  $('#rdG').onclick=()=>upd({resume_override:'generic'}, 'Set to Generic');
  $('#rdT').onclick=()=>upd({resume_override:'tailored'}, 'Set to Tailor');
  if ($('#rdC')) $('#rdC').onclick=()=>upd({resume_override:null}, 'Override cleared');
  $('#rdR').onclick=()=>upd({resume_decision:'not_run', resume_attempts:0, resume_error:null}, 'Will be decided again on the next runner pass');
  $('#rdX').onclick=closeModal;
}
async function renderInbox(el){
  const thr = state.settings.fit_threshold ?? 60;
  const leads = await q(inStreams(sb.from('leads').select('*, job_boards(name), target_companies(name)').in('status',['new','fit_checked'])).order('fit_score',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false}).limit(300));
  const conns = await q(sb.from('connections').select('company_normalised'));
  const connSet = new Map(); conns.forEach(c=>connSet.set(c.company_normalised,(connSet.get(c.company_normalised)||0)+1));
  const { count: parkedN } = await inStreams(sb.from('leads').select('id',{count:'exact',head:true}).in('status',['parked','noise']));
  state.counts = {...(state.counts||{}), inbox: leads.length}; renderNav();
  const multi = state.selected.size>1;
  el.innerHTML = pageHead('Inbox', leads.length ? `${leads.length} open lead${leads.length===1?'':'s'} · pushed to your phone at fit ${thr} or more` : 'Nothing waiting', `<button class="ghost" id="showParked">Parked · ${parkedN||0}</button><button id="newLead">+ Lead</button>`)
  + `<div class="toolbar"><input class="grow" id="inboxFilter" placeholder="Search title or company" aria-label="Search leads"></div>
  <div class="tablewrap"><table><thead><tr><th class="r" style="width:70px">Fit</th><th>Job</th><th style="width:120px">Resume</th><th class="r hide-sm" style="width:1%"><span class="hidden">Actions</span></th></tr></thead><tbody id="inboxRows"></tbody></table></div>`;
  const draw = () => { const f=($('#inboxFilter').value||'').toLowerCase(); $('#inboxRows').innerHTML = leads.filter(l=>!f||(l.title+' '+l.company).toLowerCase().includes(f)).map(l=>{
    const age = daysAgo(l.posted_at||l.created_at); const stale = age!=null && age > (state.settings.freshness_days??14);
    const know = connSet.get(normCo(l.company))||0;
    const jv = l.fit_shadow && l.fit_shadow.score!=null ? `<div class="faint" style="font-size:11.5px;margin-top:3px" title="Jev test score, not used for decisions yet">Jev ${l.fit_shadow.score}</div>` : '';
    const meta = sub([`<b style="font-weight:550;color:var(--fg-2)">${esc(l.company)}</b>`, l.location?esc(l.location):'', multi?esc(streamName(l.job_stream_id)):'', esc(l.job_boards?.name||hum(l.source_platform)||''), age==null?'':`<span class="${stale?'tag warn':''}" title="${l.posted_at_basis==='email_received'?'posting date not in the alert; email date used':'days since posted'}">${age===0?'today':age+' d ago'}</span>`]);
    const badges = [l.target_companies?'<span class="tag new">Preferred company</span>':'', l.easy_apply?'<span class="tag info">Easy apply</span>':'', know?`<span class="tag ok">You know ${know}</span>`:'', l.jd_text?'':jdTag(l.jd_text,l.jd_confidence)].filter(Boolean).join(' ');
    return `<tr class="row" data-id="${l.id}"><td class="r">${scoreBadge(l.fit_score, thr)}${jv}</td><td><div class="cell-main">${esc(l.title)}</div><div class="cell-sub">${meta}</div>${badges?`<div class="cell-sub" style="margin-top:5px">${badges}</div>`:''}</td><td>${rdTag(l)}</td>
    <td class="hide-sm"><div class="rowacts"><button class="small act" data-a="apply" data-id="${l.id}">Apply</button><button class="small act" data-a="tailor" data-id="${l.id}">Tailor</button><button class="small ghost act" data-a="park" data-id="${l.id}">Park</button>${l.url?`<a class="btn small ghost" href="${esc(l.url)}" target="_blank" rel="noopener" aria-label="Open posting">↗</a>`:'<span class="spacer"></span>'}</div></td></tr>`; }).join('') || emptyRow(4, f?'No leads match.':'You are all caught up.', f?'':' New leads arrive with the next sourcing run, about every 2 hours.');
    $('#inboxRows').querySelectorAll('.rd').forEach(x=>x.onclick=e=>{ e.stopPropagation(); rdOpen(leads.find(y=>y.id===x.dataset.id)); });
    $('#inboxRows').querySelectorAll('tr.row').forEach(tr=>tr.onclick=e=>{ if (e.target.closest('button,a,.rd')) return; openLead(leads.find(x=>x.id===tr.dataset.id)); });
    $('#inboxRows').querySelectorAll('button.act').forEach(b=>b.onclick=()=>leadAction(b.dataset.a, leads.find(x=>x.id===b.dataset.id)));
  };
  draw(); $('#inboxFilter').oninput=draw;
  $('#newLead').onclick=()=>editRecord({table:'leads',title:'New lead',fields:F.lead,row:null,defaults:{job_stream_id:selStreams()[0]||PM_STREAM,status:'new',posted_at_basis:'listing'},after:()=>go('inbox')});
  $('#showParked').onclick=()=>renderParked(el);
}
// v1.0.12: a readable lead view (fit breakdown as a table, the JD, the actions); the full form is one click away
function openLead(l){
  const thr = state.settings.fit_threshold ?? 60, age = daysAgo(l.posted_at||l.created_at);
  openModal(`<div style="display:flex;gap:14px;align-items:flex-start"><div style="flex:1;min-width:0"><h3>${esc(l.title)}</h3><div class="muted">${esc(l.company)}${l.location?' · '+esc(l.location):''}</div></div>${scoreBadge(l.fit_score, thr)}</div>
    <dl class="facts" style="margin-top:16px">
      <div><dt>Stream</dt><dd>${esc(streamName(l.job_stream_id))||'—'}</dd></div>
      <div><dt>Source</dt><dd>${esc(l.job_boards?.name||hum(l.source_platform)||'—')}</dd></div>
      <div><dt>Posted</dt><dd>${age==null?'—':(age===0?'today':age===1?'yesterday':age+' days ago')}${l.posted_at_basis==='email_received'?' <span class="faint">(email date)</span>':''}</dd></div>
      <div><dt>Resume</dt><dd>${rdTag(l)}</dd></div>
      <div><dt>Easy apply</dt><dd>${l.easy_apply?'Yes':l.easy_apply===false?'No':'—'}</dd></div>

    </dl>
    ${l.fit_breakdown?`<h3>Why this fit score</h3>${fitTable(l.fit_breakdown)}`:''}
    ${l.jd_text?`<details style="margin-top:16px"><summary style="cursor:pointer;font-weight:550">Job description</summary><pre class="text reading" style="margin-top:8px">${esc(l.jd_text)}</pre></details>`:(l.raw_snippet?`<h3>Snippet</h3><p class="reading muted">${esc(l.raw_snippet)}</p>`:'')}
    <div class="actions"><button class="primary" id="lA">Apply</button><button id="lT">Tailor and apply</button><button id="lP">Park</button>${l.url?`<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">Open posting ↗</a>`:''}<button class="right ghost" id="lE">Edit all fields</button><button class="ghost" id="lX">Close</button></div>`);

  $('#lE').onclick=()=>editRecord({table:'leads',title:'Lead',fields:F.lead,row:l,after:()=>go(state.screen)}); $('#lX').onclick=closeModal;

async function leadAction(a, l){
  if (a==='park'){
    const opts = state.noise.map(n=>`<option value="${n.id}">${esc(n.reason)}</option>`).join('');
    openModal(`<h3>Park this lead</h3><p class="muted">${esc(l.title)} · ${esc(l.company)}</p><label>Why</label><select id="parkReason">${opts}</select><div class="actions"><button class="primary" id="ok">Park</button><button id="no">Cancel</button></div>`);
    $('#no').onclick=closeModal; $('#ok').onclick=async()=>{ await q(sb.from('leads').update({status:'parked',noise_reason_id:$('#parkReason').value}).eq('id',l.id)); closeModal(); toast('Parked'); go('inbox'); };
    return;
  }
  // apply or tailor: create the application from the lead
  const decision = a==='tailor'?'tailored':'generic';
  const stream = state.streams.find(s=>s.id===l.job_stream_id) || state.streams[0];
  const docs = await q(sb.from('documents').select('id,version_label,tag,type').eq('job_stream_id', stream.id).order('created_at'));
  const generic = docs.find(d=>d.id===stream.generic_document_id) || docs.find(d=>d.tag==='generic'&&d.type==='resume');
  openModal(`<h3>${decision==='tailored'?'Tailor and apply':'Apply with generic resume'}: ${esc(l.title)} at ${esc(l.company)}</h3>
    <div class="grid2"><div><label>Apply channel</label><select id="ch"><option value="easy_apply" ${l.easy_apply?'selected':''}>Easy apply</option><option value="website" ${!l.easy_apply?'selected':''}>Website</option><option value="email">Email</option><option value="consultant">Consultant</option><option value="referral">Referral</option></select></div>
    <div><label>Applied date</label><input id="ad" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div>
    <label>Why ${decision}</label><textarea id="why" placeholder="${decision==='tailored'?'which must-haves the generic resume does not lead with':'the generic resume already leads with what they ask for'}"></textarea>
    ${decision==='tailored'?`<div class="callout">A tailored copy of ${esc(generic?generic.version_label:'the generic resume')} will be created in the library (tag tailored, company ${esc(l.company)}, status draft) for you to edit, and linked to this application.</div>`:`<div class="callout">${generic?esc(generic.version_label):'No generic resume on this stream yet'} will be linked as the document sent.</div>`}
    <div class="actions"><button class="primary" id="ok">Create application</button><button id="no">Cancel</button></div><div class="err" id="e"></div>`);
  $('#no').onclick=closeModal;
  $('#ok').onclick=async()=>{ try{
    const app = await q(sb.from('applications').insert({lead_id:l.id, job_stream_id:l.job_stream_id, title:l.title, company:l.company, location:l.location, url:l.url, job_board_id:l.job_board_id, source_platform:l.source_platform, status:'applied', applied_date:$('#ad').value||null, apply_channel:$('#ch').value, resume_decision:decision, decision_reason:$('#why').value||null, fit_score:l.fit_score, fit_breakdown:l.fit_breakdown, needs_tailored_resume:decision==='tailored', final_status:'open'}).select().single());
    await q(sb.from('leads').update({status:'promoted', promoted_application_id:app.id}).eq('id', l.id));
    await q(sb.from('status_history').insert({application_id:app.id, from_status:null, to_status:'applied', changed_at:new Date().toISOString(), cause:'manual', message_text:'Created from inbox'}));
    let docId = generic?generic.id:null;
    if (decision==='tailored' && generic){ const full = await q(sb.from('documents').select('text').eq('id',generic.id).single()); const d = await q(sb.from('documents').insert({job_stream_id:stream.id, type:'resume', tag:'tailored', tailored_for_company:l.company, derived_from_document_id:generic.id, version_label:`Tailored · ${l.company} · ${new Date().toISOString().slice(0,10)}`, text:full.text, status:'draft'}).select().single()); docId=d.id; }
    if (docId) await q(sb.from('application_documents').insert({application_id:app.id, document_id:docId, role:'resume', sent_at:decision==='generic'?new Date().toISOString():null}));
    state.cache={}; closeModal(); toast('Application created'); openApplication(app.id);
  }catch(e){ $('#e').textContent=e.message||e; } };
}

/* ===================== Pipeline & Applications ===================== */
const STATUSES = ['applied','screening','round_1','round_2','round_3','offer','rejected','withdrawn','ghosted'];
async function loadApps(){ return q(inStreams(sb.from('applications').select('*, job_boards(name), consultant_organizations(name)')).order('updated_at',{ascending:false})); }
async function renderPipeline(el){
  const apps = await loadApps();
  const closedN = apps.filter(a=>CLOSED.includes(a.status)).length, liveN = apps.length - closedN;
  const cols = state.showClosed ? STATUSES : STATUSES.filter(s=>!CLOSED.includes(s));
  const multi = state.selected.size>1;
  el.innerHTML = pageHead('Pipeline', `${liveN} live application${liveN===1?'':'s'} · drag a card to move it`, `<button class="ghost" id="tgClosed">${state.showClosed?'Hide closed':'Show closed · '+closedN}</button><button id="newApp">+ Application</button>`)
  + `<div class="kanban">${cols.map(s=>{ const list=apps.filter(a=>a.status===s); return `<div class="col" data-s="${s}"><h4>${pill(s)}<span class="muted">${list.length}</span></h4>${list.map(a=>{ const od=a.next_action_due&&new Date(a.next_action_due)<new Date(new Date().toDateString());
      return `<div class="kcard" draggable="true" data-id="${a.id}"><b>${esc(a.company)}</b><div class="t">${esc(a.title)}</div>${(multi||a.resume_decision)?`<div class="m">${sub([multi?esc(streamName(a.job_stream_id)):'', a.resume_decision?esc(hum(a.resume_decision))+' resume':''])}</div>`:''}${a.next_action?`<span class="tag ${od?'warn':''}">${esc(a.next_action)}${a.next_action_due?' · '+fmtD(a.next_action_due):''}</span>`:''}<select class="moveTo" aria-label="Move ${esc(a.company)} to"><option value="">Move to…</option>${STATUSES.filter(x=>x!==s).map(x=>`<option value="${x}">${hum(x)}</option>`).join('')}</select></div>`; }).join('')||'<div class="none">Nothing here</div>'}</div>`; }).join('')}</div>`;
  const back = ()=>{ closeModal(); go('pipeline'); };
  const move = (id, to) => { const a = apps.find(x=>x.id===id); if (!a || a.status===to) return; changeStatus(a, back, to); };
  el.querySelectorAll('.kcard').forEach(c=>{
    c.onclick=e=>{ if (e.target.closest('select')) return; openApplication(c.dataset.id); };
    c.addEventListener('dragstart', e=>{ c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', c.dataset.id); });
    c.addEventListener('dragend', ()=>c.classList.remove('dragging'));
    const sel=c.querySelector('select.moveTo'); sel.onclick=e=>e.stopPropagation(); sel.onchange=()=>{ if (sel.value) move(c.dataset.id, sel.value); };
  });
  el.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; col.classList.add('over'); });
    col.addEventListener('dragleave', e=>{ if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', e=>{ e.preventDefault(); col.classList.remove('over'); move(e.dataTransfer.getData('text/plain'), col.dataset.s); });
  });
  $('#tgClosed').onclick=()=>{ state.showClosed=!state.showClosed; renderPipeline(el); };
  $('#newApp').onclick=()=>editRecord({table:'applications',title:'New application',fields:F.application,row:null,defaults:{job_stream_id:selStreams()[0]||PM_STREAM,status:'applied',final_status:'open',applied_date:new Date().toISOString().slice(0,10)},after:s=>s?openApplication(s.id):go('pipeline')});
}
async function renderApplications(el){

      <td class="r hide-sm"><span class="fit muted">${a.fit_score==null?'–':Math.round(a.fit_score)}</span></td></tr>`; }).join('')||emptyRow(5, f?'No applications match.':v==='open'?'No live applications right now.':'Nothing here.', v==='open'&&!f?' Apply from the Inbox and they show up here.':'');

  $('#newApp').onclick=()=>editRecord({table:'applications',title:'New application',fields:F.application,row:null,defaults:{job_stream_id:selStreams()[0]||PM_STREAM,status:'applied',final_status:'open'},after:s=>s?openApplication(s.id):go('applications')});

function importConnections(){
  openModal(`<h3>Import LinkedIn connections</h3><p class="muted">LinkedIn → Settings → Data privacy → Get a copy of your data → Connections. Upload the Connections.csv here. Existing rows are replaced.</p><input type="file" id="csv" accept=".csv,text/csv"><div class="actions"><button class="primary" id="ok">Import</button><button id="no">Cancel</button></div><div class="err" id="e"></div>`);
  $('#no').onclick=closeModal;
  $('#ok').onclick=async()=>{ try{ const f=$('#csv').files[0]; if(!f) throw new Error('Choose the file first'); const text=await f.text(); const rows=parseCsv(text); const hi=rows.findIndex(r=>r.some(c=>/first name/i.test(c))); if(hi<0) throw new Error('No "First Name" header found; is this the Connections export?'); const h=rows[hi].map(c=>c.trim().toLowerCase()); const idx=n=>h.findIndex(x=>x===n);
      const recs=rows.slice(hi+1).filter(r=>r.length>=3&&r[idx('first name')]).map(r=>({first_name:r[idx('first name')], last_name:r[idx('last name')], company:r[idx('company')]||null, company_normalised:normCo(r[idx('company')]), position:r[idx('position')]||null, linkedin_url:r[idx('url')]||null, connected_on:parseLiDate(r[idx('connected on')]), imported_at:new Date().toISOString()}));
      await q(sb.from('connections').delete().neq('id','00000000-0000-0000-0000-000000000000'));
      for (let i=0;i<recs.length;i+=500) await q(sb.from('connections').insert(recs.slice(i,i+500)));
      closeModal(); toast(recs.length+' connections imported'); go('people'); }catch(e){ $('#e').textContent=e.message||e; } };
}
function parseCsv(t){ const rows=[]; let row=[], cur='', inq=false; for (let i=0;i<t.length;i++){ const c=t[i]; if (inq){ if (c==='"'){ if (t[i+1]==='"'){cur+='"'; i++;} else inq=false; } else cur+=c; } else { if (c==='"') inq=true; else if (c===','){ row.push(cur); cur=''; } else if (c==='\n'||c==='\r'){ if (c==='\r'&&t[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=c; } } if (cur!==''||row.length){ row.push(cur); rows.push(row); } return rows; }
function parseLiDate(s){ if(!s) return null; const d=new Date(s); return isNaN(d)?null:d.toISOString().slice(0,10); }

/* ===================== Prep (v1.0.11: prep rooms, practice mode, answer bank) ===================== */
const PREP_KINDS = [['brief','Brief'],['case_file','Case files'],['mock','Mock grill'],['answer','Answers'],['number','Numbers'],['checklist','Demo checklist'],['ask_them','Ask them']];
function roundLbl(i){ const st=i.stage_label||''; return /round/i.test(st) ? st : 'Round '+i.round_number+(st?' · '+st:''); }
const PREP_TICK = ['checklist','ask_them']; // rows you tick off, not rate
const RATE = ['Weak','OK','Strong'];
state.prepView = state.prepView || {tab:'rooms'};
function prepOrder(a,b){ return (a.sort_order??1e9)-(b.sort_order??1e9) || String(a.created_at).localeCompare(String(b.created_at)); }
function dotsHtml(c){ return `<span class="dots" aria-label="confidence ${c||0} of 3">${[1,2,3].map(n=>`<i class="${(c||0)>=n?'on':''}"></i>`).join('')}</span>`; }
function untilText(t){ const ms=t-Date.now(); if (ms<=0) return ['Done','call time passed']; const m=Math.round(ms/60000), d=Math.floor(m/1440), hh=Math.floor((m%1440)/60), mm=m%60; return d>=1?[d+(d===1?' day ':' days ')+hh+' h','to the call']:[hh?hh+' h '+mm+' min':mm+' min','to the call']; }
function callTime(iv){ if (iv.starts_at) return new Date(iv.starts_at); if (iv.interview_date) return new Date(iv.interview_date+'T23:59:00'); return null; }
async function ratePrep(row, n){
  const now=new Date().toISOString(); const patch={confidence:n, rehearse_count:(row.rehearse_count||0)+1, last_rehearsed_at:now, last_reviewed_at:now};
  await q(sb.from('prep_answers').update(patch).eq('id',row.id)); Object.assign(row, patch);
}

  if (v.tab==='bank') return renderBank($('#prepBody'), rows.filter(r=>!r.interview_id));
  const ivs = await q(sb.from('interviews').select('*, applications(company,title,job_stream_id)').order('interview_date',{ascending:true}));
  const today = new Date().toISOString().slice(0,10);

  const list = ivs.filter(i=>withRows.has(i.id) || (i.interview_date && i.interview_date>=today))
    .filter(i=>!i.applications||state.selected.size===state.streams.length||selStreams().includes(i.applications.job_stream_id))
    .sort((a,b)=>{ const fa=(a.interview_date||'')>=today, fb=(b.interview_date||'')>=today; if (fa!==fb) return fa?-1:1; return fa ? String(a.interview_date).localeCompare(b.interview_date) : String(b.interview_date).localeCompare(a.interview_date); });
  $('#prepBody').innerHTML = list.length ? `<p class="muted">One room per interview round. Upcoming rounds first.</p><div class="room-list">${list.map(i=>{ const rs=rows.filter(r=>r.interview_id===i.id), done=rs.filter(r=>r.confidence).length, t=callTime(i); return `<div class="card" data-id="${i.id}" tabindex="0" role="button"><h4>${esc(i.applications?.company||'')} · ${esc(roundLbl(i))}</h4><div class="muted">${esc(i.applications?.title||'')}</div><div style="margin-top:6px">${esc(i.interviewer_name||'interviewer not set')} · ${i.starts_at?fmtDT(i.starts_at):fmtD(i.interview_date)}</div><div class="mono muted" style="margin-top:6px">${rs.length} items · ${done} rated${t&&t>Date.now()?' · '+untilText(t)[0]+' to go':''}</div></div>`; }).join('')}</div>`
    : `<p class="muted">No prep rooms yet. Open an interview round and press "Prep room" to start one.</p>`;
  $('#prepBody').querySelectorAll('.card').forEach(c=>{ const open=()=>{ state.prepView={room:c.dataset.id, sec:null}; go('prep'); }; c.onclick=open; c.onkeydown=e=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } }; });
}
async function renderRoom(el, ivId, rows){
  const iv = await q(sb.from('interviews').select('*, applications(id,company,title,job_stream_id)').eq('id',ivId).single());

    $('#roomPane').querySelectorAll('.prow').forEach(p=>{ const r=rows.find(x=>x.id===p.dataset.id);

      p.querySelectorAll('.rateBtn').forEach(b=>b.onclick=async()=>{ try{ await ratePrep(r, +b.dataset.n); toast('Saved: '+RATE[b.dataset.n-1]); renderRoom(el, ivId, rows); }catch(e){ err(e); } });
      const tb=p.querySelector('.tickBtn'); if (tb) tb.onclick=async()=>{ try{ if (r.confidence){ await q(sb.from('prep_answers').update({confidence:null}).eq('id',r.id)); r.confidence=null; } else await ratePrep(r,3); renderRoom(el, ivId, rows); }catch(e){ err(e); } };
      p.querySelector('.editBtn').onclick=()=>editRecord({table:'prep_answers',title:'Prep item',fields:F.prep,row:r,after:()=>go('prep')});
    });
  };
  pane();
  el.querySelectorAll('.rail button').forEach(b=>b.onclick=()=>{ v.sec=b.dataset.k; renderRoom(el, ivId, rows); });
  $('#backRooms').onclick=()=>{ state.prepView={tab:'rooms'}; go('prep'); };
  $('#openIv').onclick=()=>openInterview(ivId, ()=>{ closeModal(); go('prep'); });
  $('#addItem').onclick=()=>editRecord({table:'prep_answers',title:'New prep item',fields:F.prep,row:null,defaults:{job_stream_id:iv.applications?.job_stream_id||PM_STREAM,kind:v.sec||'mock',status:'approved',sort_order:(Math.max(0,...rows.map(r=>r.sort_order||0))+1),_force:{interview_id:ivId,application_id:iv.application_id,source:'hand_written'}},after:()=>go('prep')});
  $('#practice').onclick=()=>practice(rows.filter(r=>['mock','answer'].includes(r.kind||'answer')), ()=>renderRoom(el, ivId, rows));

let practiceTimer=null;
function practice(pool, onClose){
  if (!pool.length){ toast('No questions to practise here.'); return; }
  const order = [...pool].sort((a,b)=>(a.confidence||0)-(b.confidence||0) || (a.rehearse_count||0)-(b.rehearse_count||0) || prepOrder(a,b));
  let i=0, rated=0;
  const stop=()=>{ if (practiceTimer){ clearInterval(practiceTimer); practiceTimer=null; } };
  const show=()=>{ stop(); const r=order[i];
    openModal(`<div class="practice"><div class="toolbar"><span class="mono muted">Practice · ${i+1} of ${order.length} · ${esc(r.topic||'')}</span><span class="right timer" id="ptimer">1:30</span></div><h3>${esc(r.question)}</h3><p class="muted">Say your answer out loud first. Answer first, then the detail.</p><div class="actions"><button class="primary" id="pStart">Start 90s</button><button id="pReveal">Reveal answer</button><button id="pSkip">Skip</button><button id="pEnd" class="right">End</button></div><div id="pAns" hidden><div class="callout" style="white-space:pre-wrap">${esc(r.best_answer||'')}</div>${r.follow_up?`<p><b>Likely follow-up:</b> ${esc(r.follow_up)}</p>`:''}${r.evidence?`<p class="mono muted">evidence: ${esc(r.evidence)}</p>`:''}<div class="actions"><span class="muted">How was yours?</span>${RATE.map((l,n)=>`<button class="pRate" data-n="${n+1}">${l}</button>`).join('')}</div></div><div class="err" id="pErr"></div></div>`);
    $('#pStart').onclick=()=>{ stop(); let s=90; const tick=()=>{ const el=$('#ptimer'); if(!el){ stop(); return; } el.textContent=(s<0?'-':'')+Math.floor(Math.abs(s)/60)+':'+String(Math.abs(s)%60).padStart(2,'0'); el.classList.toggle('late', s<0); s--; }; tick(); practiceTimer=setInterval(tick,1000); };
    $('#pReveal').onclick=()=>{ $('#pAns').hidden=false; $('#pReveal').disabled=true; };
    $('#pSkip').onclick=()=>next();
    $('#pEnd').onclick=()=>finish();
    $('#modal').querySelectorAll('.pRate').forEach(b=>b.onclick=async()=>{ try{ await ratePrep(r, +b.dataset.n); rated++; next(); }catch(e){ $('#pErr').textContent=e.message||e; } });
  };
  const next=()=>{ i++; if (i>=order.length) finish(); else show(); };
  const finish=()=>{ stop(); openModal(`<h3>Practice done</h3><p>${rated} rated this run. Weak ones come back first next time.</p><div class="actions"><button class="primary" id="pClose">Close</button></div>`); $('#pClose').onclick=()=>{ closeModal(); onClose&&onClose(); }; };
  show();
}
function renderBank(el, rows){

  $('#newP').onclick=()=>editRecord({table:'prep_answers',title:'Prep answer',fields:F.prep,row:null,defaults:{job_stream_id:selStreams()[0]||PM_STREAM,kind:'answer',status:'approved',_force:{source:'hand_written'}},after:()=>go('prep')});
}

async function renderNumbers(el){
  const [apps, leads, rounds, notes] = await Promise.all([q(inStreams(sb.from('applications').select('id,job_stream_id,status,final_status,applied_date,resume_decision,created_at,lead_id'))), q(inStreams(sb.from('leads').select('id,status,fit_score,posted_at,created_at,promoted_application_id'))), q(sb.from('interviews').select('id,application_id,result,interview_date,round_number')), q(sb.from('notifications').select('minutes_to_reply,sent_at,replied_at'))]);
  const appIds=new Set(apps.map(a=>a.id)); const r=rounds.filter(x=>appIds.has(x.application_id));
  const withInt = new Set(r.map(x=>x.application_id)).size;
  const wk = d => { const x=new Date(d); const s=new Date(x); s.setDate(x.getDate()-((x.getDay()+6)%7)); return s.toISOString().slice(0,10); };
  const weeks={}; apps.forEach(a=>{ const k=wk(a.applied_date||a.created_at); weeks[k]=(weeks[k]||0)+1; });
  const byDec = {generic:apps.filter(a=>a.resume_decision==='generic'), tailored:apps.filter(a=>a.resume_decision==='tailored')};
  const intRate = arr => arr.length?Math.round(100*arr.filter(a=>r.some(x=>x.application_id===a.id)).length/arr.length)+'%':'—';
  const passByRound = {}; r.forEach(x=>{ const k='round '+x.round_number; passByRound[k]=passByRound[k]||{n:0,adv:0}; passByRound[k].n++; if (x.result==='advanced') passByRound[k].adv++; });
  const postToApply = apps.map(a=>{ const l=leads.find(x=>x.promoted_application_id===a.id||x.id===a.lead_id); return l&&l.posted_at&&a.applied_date?(new Date(a.applied_date)-new Date(l.posted_at))/86400000:null; }).filter(x=>x!=null).sort((a,b)=>a-b);
  const med = arr => arr.length?arr[Math.floor(arr.length/2)].toFixed(1):'—';
  const replies = notes.filter(n=>n.minutes_to_reply!=null).map(n=>n.minutes_to_reply).sort((a,b)=>a-b);
  const good = leads.filter(l=>l.fit_score!=null && l.fit_score>=(state.settings.fit_threshold??60));
  const actedFast = good.filter(l=>l.status==='promoted'||l.status==='parked');
  el.innerHTML = pageHead('Numbers', 'How the search is going, measured kindly') + `<div class="kpis">
    <div class="kpi"><b>${apps.length}</b><span>applications</span></div>
    <div class="kpi"><b>${apps.length?Math.round(100*withInt/apps.length)+'%':'—'}</b><span>interviews per application</span></div>
    <div class="kpi"><b>${intRate(byDec.generic)} / ${intRate(byDec.tailored)}</b><span>interview rate: generic / tailored</span></div>
    <div class="kpi"><b>${med(postToApply)} d</b><span>median posting to apply</span></div>
    <div class="kpi"><b>${apps.length?Math.round(100*byDec.tailored.length/apps.length)+'%':'—'}</b><span>applications with tailored resume</span></div>
    <div class="kpi"><b>${med(replies)} min</b><span>median minutes to reply to a push</span></div>
    <div class="kpi"><b>${good.length?Math.round(100*actedFast.length/good.length)+'%':'—'}</b><span>good leads acted on</span></div>
    <div class="kpi"><b>${apps.filter(a=>a.final_status==='rejected').length} / ${apps.filter(a=>a.final_status==='offer').length}</b><span>rejected / offers</span></div></div>
  <div class="grid2" style="gap:16px"><div class="card"><h4>Applications per week</h4><table class="bars"><tbody>${(()=>{ const ent=Object.entries(weeks).sort(), mx=Math.max(1,...ent.map(e=>e[1])); return ent.map(([k,v])=>`<tr><td class="nowrap muted" style="width:90px">${fmtD(k)}</td><td><div class="bar" style="width:${Math.round(100*v/mx)}%"></div></td><td class="r num" style="width:36px">${v}</td></tr>`).join('')||'<tr><td class="muted">None yet</td></tr>'; })()}</tbody></table></div>
  <div class="card"><h4>Pass rate per round</h4><table><tbody>${Object.entries(passByRound).map(([k,v])=>`<tr><td>${k}</td><td>${v.adv} advanced of ${v.n} (${Math.round(100*v.adv/v.n)}%)</td></tr>`).join('')||'<tr><td class="muted">no rounds yet</td></tr>'}</tbody></table>
  <h4 style="margin-top:18px">Lead funnel</h4><table><tbody><tr><td>seen</td><td>${leads.length}</td></tr><tr><td>scored</td><td>${leads.filter(l=>l.fit_score!=null).length}</td></tr><tr><td>above gate</td><td>${good.length}</td></tr><tr><td>applied</td><td>${leads.filter(l=>l.status==='promoted').length}</td></tr><tr><td>parked</td><td>${leads.filter(l=>l.status==='parked'||l.status==='noise').length}</td></tr></tbody></table></div></div>
  <p class="muted reading" style="font-size:13.5px;margin-top:18px">Definitions: "interviews per application" = applications with at least one round ÷ applications. "Good leads acted on" = leads at or above the fit gate that were applied to or parked (a decision was made).</p>`;
}
