<!doctype html>
<!-- Job Application Driver · app v1.0.5 · 17 Oct 2026 · v1.0.5: Agents screen (on/off, schedule, model, versioned prompts, per-stream fitment rubric with weights/anchors/caps, guardrails, labelled evals with a go-live gate), read by runner v1.0.8. v1.0.4: #app=<id> deep link opens an application (used by Telegram replies from the runner). v1.0.3: login account switched to sudharsan454@gmail.com (all rows re-owned in Supabase, allowlist trigger updated). v1.0.2: boot deferred out of the auth callback (page froze on reload with a saved session). v1.0.1: application detail embed disambiguated (two FKs between applications and leads). v1.0 · 10 Oct 2026 · single-file web app on Supabase (Project Zero) · login: sudharsan454@gmail.com only · changelog at the foot of this file -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Job Application Driver</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f7f6f2;--surface:#fff;--fg:#1d2320;--muted:#5b645f;--line:#d9ddd6;--accent:#0f6e63;--accent-soft:#e2f0ec;--warn:#9a5b00;--warn-soft:#fbf0dc;--bad:#a33a2f;--bad-soft:#f8e5e2;--new:#5b3f9e;--new-soft:#ece6f7;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#15191a;--surface:#1d2324;--fg:#e6e9e4;--muted:#9aa49d;--line:#313a38;--accent:#5fc3b3;--accent-soft:#163b36;--warn:#e3a94a;--warn-soft:#3a2b10;--bad:#e2857a;--bad-soft:#3d1f1b;--new:#b6a1ea;--new-soft:#2b2340;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
a{color:var(--accent)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 10px;border-radius:4px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.small{padding:3px 8px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 8px;border-radius:4px;width:100%}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
.app{display:none;min-height:100%}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.brand{font-weight:600}
.brand small{font-family:var(--mono);font-weight:400;color:var(--muted);margin-left:6px}
nav{display:flex;flex-wrap:wrap;gap:4px}
nav button{border:none;background:none;padding:6px 8px;border-radius:4px;color:var(--muted)}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.streams{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12.5px;cursor:pointer;user-select:none}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
main{padding:16px;max-width:1280px;margin:0 auto}
h2{font-size:1.2rem;margin:0 0 12px}h3{font-size:1rem;margin:16px 0 8px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:160px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:var(--accent-soft)}
.scroll{overflow-x:auto}
.tag{display:inline-block;padding:1px 7px;border-radius:3px;font-family:var(--mono);font-size:11px;white-space:nowrap;background:var(--line);color:var(--muted)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.new{background:var(--new-soft);color:var(--new)}
.muted{color:var(--muted)}.mono{font-family:var(--mono);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0}
.card h4{margin:0 0 6px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px}
.kpi b{display:block;font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;min-height:120px}
.col h4{margin:0 0 8px;font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kcard{border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px;cursor:pointer;background:var(--bg)}
.kcard:hover{border-color:var(--accent)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:8px;max-width:860px;width:100%;padding:16px 18px;margin:auto}
.modal h3{margin:0 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.actions .right{margin-left:auto}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:20;display:none;max-width:90vw}
.login{max-width:360px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.login h1{font-size:1.2rem;margin:0 0 4px}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1em}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:10px 0}
.tabs button{border:none;background:none;border-bottom:2px solid transparent;border-radius:0;color:var(--muted)}
.tabs button.active{border-bottom-color:var(--accent);color:var(--accent)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;margin:8px 0;border-radius:0 4px 4px 0}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
pre.text{white-space:pre-wrap;font-family:var(--body);font-size:13px;background:var(--bg);border:1px solid var(--line);padding:10px;border-radius:4px;max-height:360px;overflow:auto}
.hidden{display:none!important}
.fit{font-family:var(--mono);font-weight:500}
.ag-split{display:grid;grid-template-columns:3fr 2fr;gap:0 16px}.ag-split>*{min-width:0}
.grid2.ag-3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:640px){.ag-split,.grid2.ag-3{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login" class="login">
  <h1>Job Application Driver</h1>
  <div class="muted">v1.0.5 · one account only</div>
  <form id="loginForm">
    <label for="email">Email</label><input id="email" type="email" autocomplete="username" value="sudharsan454@gmail.com">
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
    <div class="actions"><button class="primary" type="submit" id="loginBtn">Sign in</button></div>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" class="app">
  <div class="topbar">
    <div class="brand">Job Application Driver<small>v1.0.5</small></div>
    <nav id="nav"></nav>
    <div class="streams" id="streamChips"></div>
    <button class="small" id="logoutBtn">Sign out</button>
  </div>
  <main id="main"></main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===================== config ===================== */
const SUPABASE_URL = 'https://bxzmneeacjjtwmtdsrjd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dcwUfURxdPF8AquVEs7KzA_xpcJQR1b'; // publishable key: safe in the browser; RLS does the isolation
const ALLOWED_EMAIL = 'sudharsan454@gmail.com';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const PM_STREAM = '11111111-1111-4111-8111-000000000001';

/* ===================== small helpers ===================== */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtD = d => d ? new Date(d).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'2-digit'}) : '';
const fmtDT = d => d ? new Date(d).toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
const daysAgo = d => d ? Math.floor((Date.now() - new Date(d)) / 86400000) : null;
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toastT); toastT=setTimeout(()=>t.style.display='none', 2600); }
function err(e){ console.error(e); toast('Error: ' + (e.message || e)); }
async function q(p){ const {data, error} = await p; if (error) throw error; return data; }

/* ===================== state ===================== */
const state = { user:null, streams:[], selected:new Set(), settings:{}, screen:'inbox', boards:[], noise:[], cache:{} };
function selStreams(){ return [...state.selected]; }
function streamName(id){ return (state.streams.find(s=>s.id===id)||{}).name || ''; }
function inStreams(qb, col='job_stream_id'){ const ids=selStreams(); return ids.length && ids.length < state.streams.length ? qb.in(col, ids) : qb; }

/* ===================== auth ===================== */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#loginErr').textContent=''; $('#loginBtn').disabled=true;
  const email = $('#email').value.trim().toLowerCase(), password = $('#password').value;
  if (email !== ALLOWED_EMAIL) { $('#loginErr').textContent = 'This app has one account: ' + ALLOWED_EMAIL; $('#loginBtn').disabled=false; return; }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  $('#loginBtn').disabled=false;
  if (error) { $('#loginErr').textContent = error.message; return; }
});
$('#logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); });
// Never await Supabase calls inside this callback: supabase-js holds the auth lock while it runs, and a query
// that needs the token would wait for the same lock (page froze on reload in v1.0.1). Defer with setTimeout.
let booted = false;
sb.auth.onAuthStateChange((ev, session) => {
  setTimeout(async () => {
    if (session && session.user && session.user.email?.toLowerCase() === ALLOWED_EMAIL) { state.user = session.user; if (!booted) { booted = true; try { await boot(); } catch(e) { booted = false; err(e); } } }
    else if (session && session.user) { await sb.auth.signOut(); $('#loginErr').textContent='Not an allowed account.'; }
    else { booted = false; state.user=null; $('#app').style.display='none'; $('#login').style.display='block'; }
  }, 0);
});

async function boot(){
  $('#login').style.display='none'; $('#app').style.display='block';
  state.streams = await q(sb.from('job_streams').select('*').order('created_at'));
  try { const saved = JSON.parse(localStorage.getItem('jd.streams')||'null'); if (saved) saved.forEach(id=>state.selected.add(id)); } catch(e){}
  if (!state.selected.size) state.streams.forEach(s=>state.selected.add(s.id));
  state.boards = await q(sb.from('job_boards').select('*').order('name'));
  state.noise = await q(sb.from('noise_reasons').select('*').order('reason'));
  const st = await q(sb.from('user_settings').select('*').maybeSingle()); state.settings = (st && st.settings) || {};
  renderNav(); renderChips();
  const hash = location.hash.replace('#','') || 'inbox';
  if (hash.startsWith('app=')) { await go('pipeline'); openApplication(hash.slice(4)); return; }
  go(SCREENS[hash] ? hash : 'inbox');
}

/* ===================== navigation ===================== */
const SCREENS = {
  inbox:{label:'Inbox', render:renderInbox},
  pipeline:{label:'Pipeline', render:renderPipeline},
  applications:{label:'Applications', render:renderApplications},
  targets:{label:'Target companies', render:renderTargets},
  streams:{label:'Streams', render:renderStreams},
  resumes:{label:'Resumes', render:renderResumes},
  people:{label:'People', render:renderPeople},
  interviews:{label:'Interviews', render:renderInterviews},
  prep:{label:'Prep', render:renderPrep},
  numbers:{label:'Numbers', render:renderNumbers},
  agents:{label:'Agents', render:renderAgents},
  runs:{label:'Runs & questions', render:renderRuns},
  settings:{label:'Settings', render:renderSettings},
};
function renderNav(){ $('#nav').innerHTML = Object.entries(SCREENS).map(([k,v])=>`<button data-s="${k}" class="${k===state.screen?'active':''}">${v.label}</button>`).join(''); $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.s)); }
function renderChips(){ $('#streamChips').innerHTML = state.streams.map(s=>`<span class="chip ${state.selected.has(s.id)?'on':''}" data-id="${s.id}">${esc(s.name)}</span>`).join(''); $('#streamChips').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ const id=c.dataset.id; if (state.selected.has(id)) { if (state.selected.size>1) state.selected.delete(id); } else state.selected.add(id); localStorage.setItem('jd.streams', JSON.stringify([...state.selected])); renderChips(); go(state.screen); }); }
async function go(s){ state.screen=s; location.hash=s; renderNav(); $('#main').innerHTML='<div class="muted">Loading…</div>'; try { await SCREENS[s].render($('#main')); } catch(e){ err(e); $('#main').innerHTML='<div class="err">'+esc(e.message||e)+'</div>'; } }
window.addEventListener('hashchange', ()=>{ const h=location.hash.replace('#',''); if (h.startsWith('app=')) { openApplication(h.slice(4)); return; } if (SCREENS[h] && h!==state.screen) go(h); });

/* ===================== generic form engine ===================== */
// field: {k, label, t:'text|textarea|number|date|datetime|bool|select|fk|array|json', opts:[], fk:{table,label}, ro:true}
async function fkOptions(fk){ const key='fk:'+fk.table; if (!state.cache[key]) state.cache[key] = await q(sb.from(fk.table).select('id,'+fk.label).order(fk.label)); return state.cache[key]; }
async function fieldHtml(f, v){
  const id='f_'+f.k; const val = v==null?'':v;
  if (f.t==='textarea'||f.t==='json') return `<label for="${id}">${esc(f.label)}</label><textarea id="${id}" ${f.ro?'readonly':''}>${esc(f.t==='json'&&val!==''?JSON.stringify(val,null,1):val)}</textarea>`;
  if (f.t==='bool') return `<label for="${id}">${esc(f.label)}</label><select id="${id}"><option value="">—</option><option value="true" ${val===true?'selected':''}>yes</option><option value="false" ${val===false?'selected':''}>no</option></select>`;
  if (f.t==='select') return `<label for="${id}">${esc(f.label)}</label><select id="${id}"><option value="">—</option>${f.opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  if (f.t==='fk'){ const opts=await fkOptions(f.fk); return `<label for="${id}">${esc(f.label)}</label><select id="${id}"><option value="">—</option>${opts.map(o=>`<option value="${o.id}" ${o.id===val?'selected':''}>${esc(o[f.fk.label])}</option>`).join('')}</select>`; }
  if (f.t==='array') return `<label for="${id}">${esc(f.label)} <span style="text-transform:none">(comma separated)</span></label><input id="${id}" value="${esc(Array.isArray(val)?val.join(', '):val)}">`;
  const type = f.t==='number'?'number':f.t==='date'?'date':f.t==='datetime'?'datetime-local':'text';
  let sv = val; if (f.t==='datetime' && val) sv = new Date(val).toISOString().slice(0,16);
  return `<label for="${id}">${esc(f.label)}</label><input id="${id}" type="${type}" value="${esc(sv)}" ${f.ro?'readonly':''}>`;
}
function readField(f){
  const el=$('#f_'+f.k); if(!el) return undefined; let v=el.value;
  if (f.t==='number') return v===''?null:Number(v);
  if (f.t==='bool') return v===''?null:v==='true';
  if (f.t==='array') return v.trim()===''?null:v.split(',').map(s=>s.trim()).filter(Boolean);
  if (f.t==='json') { if (v.trim()==='') return null; try { return JSON.parse(v); } catch(e){ throw new Error('Invalid JSON in '+f.label); } }
  if (f.t==='datetime') return v===''?null:new Date(v).toISOString();
  return v===''?null:v;
}
function openModal(html){ $('#modal').innerHTML=html; $('#modalBg').style.display='flex'; }
function closeModal(){ $('#modalBg').style.display='none'; $('#modal').innerHTML=''; }
$('#modalBg').addEventListener('click', e=>{ if (e.target===$('#modalBg')) closeModal(); });
document.addEventListener('keydown', e=>{ if (e.key==='Escape') closeModal(); });

// Generic editor: table, fields, row (null = new), after(saved) callback, extra html
async function editRecord({table, title, fields, row, defaults={}, after, extra='', canDelete=true}){
  const parts = []; for (const f of fields) parts.push(await fieldHtml(f, row ? row[f.k] : (defaults[f.k] ?? null)));
  openModal(`<h3>${esc(title)}</h3><div class="grid2">${parts.map(p=>`<div>${p}</div>`).join('')}</div>${extra}
    <div class="actions"><button class="primary" id="saveBtn">Save</button><button id="cancelBtn">Cancel</button>${row&&canDelete?'<button class="right" id="delBtn" style="color:var(--bad)">Delete</button>':''}</div><div class="err" id="formErr"></div>`);
  $('#cancelBtn').onclick=closeModal;
  $('#saveBtn').onclick=async()=>{ try{ const payload={}; for (const f of fields){ if (f.ro) continue; const v=readField(f); if (v!==undefined) payload[f.k]=v; } Object.assign(payload, defaults._force||{});
      let saved; if (row) saved = await q(sb.from(table).update(payload).eq('id', row.id).select().single()); else saved = await q(sb.from(table).insert(payload).select().single());
      state.cache={}; closeModal(); toast('Saved'); if (after) await after(saved); } catch(e){ $('#formErr').textContent=e.message||e; } };
  if (row&&canDelete) $('#delBtn').onclick=async()=>{ const ok=await confirmBox('Delete this record? This cannot be undone.'); if(!ok) return; try{ await q(sb.from(table).delete().eq('id', row.id)); state.cache={}; closeModal(); toast('Deleted'); if (after) await after(null);}catch(e){ $('#formErr').textContent=e.message||e; } };
}
function confirmBox(msg){ return new Promise(res=>{ const prev=$('#modal').innerHTML; openModal(`<h3>Confirm</h3><p>${esc(msg)}</p><div class="actions"><button class="primary" id="okBtn">Yes</button><button id="noBtn">No</button></div>`); $('#okBtn').onclick=()=>{ closeModal(); res(true); }; $('#noBtn').onclick=()=>{ $('#modal').innerHTML=prev; res(false); }; }); }

/* ===================== field sets ===================== */
const streamFk = {k:'job_stream_id', label:'Stream', t:'fk', fk:{table:'job_streams', label:'name'}};
const boardFk = {k:'job_board_id', label:'Source / portal', t:'fk', fk:{table:'job_boards', label:'name'}};
const F = {

/* ===================== Inbox ===================== */
async function renderInbox(el){
  const thr = state.settings.fit_threshold ?? 60;
  const leads = await q(inStreams(sb.from('leads').select('*, job_boards(name), target_companies(name)').in('status',['new','fit_checked'])).order('fit_score',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false}).limit(300));
  const conns = await q(sb.from('connections').select('company_normalised'));
  const connSet = new Map(); conns.forEach(c=>connSet.set(c.company_normalised,(connSet.get(c.company_normalised)||0)+1));
  const parked = await q(inStreams(sb.from('leads').select('id',{count:'exact',head:true}).eq('status','parked')));
  el.innerHTML = `<h2>Inbox <span class="muted" style="font-weight:400;font-size:14px">${leads.length} open leads · fit gate ${thr}</span></h2>
  <div class="toolbar"><input class="grow" id="inboxFilter" placeholder="filter title / company"><button id="newLead">+ Lead</button><button id="showParked">Parked</button></div>
  <div class="scroll"><table><thead><tr><th>Fit</th><th>Title</th><th>Company</th><th>Location</th><th>Stream</th><th>Source</th><th>Age</th><th>Easy</th><th>Know</th><th>Actions</th></tr></thead><tbody id="inboxRows"></tbody></table></div>`;
  const draw = () => { const f=($('#inboxFilter').value||'').toLowerCase(); $('#inboxRows').innerHTML = leads.filter(l=>!f||(l.title+' '+l.company).toLowerCase().includes(f)).map(l=>{
    const age = daysAgo(l.posted_at||l.created_at); const stale = age!=null && age > (state.settings.freshness_days??14);
    const fit = l.fit_score==null?'<span class="tag">not scored</span>':`<span class="fit" style="color:${l.fit_score>=thr?'var(--accent)':'var(--warn)'}">${Math.round(l.fit_score)}</span>`;
    const know = connSet.get(normCo(l.company))||0;
    return `<tr class="row" data-id="${l.id}"><td>${fit}</td><td>${esc(l.title)}${l.target_companies?` <span class="tag new">preferred co.</span>`:''}</td><td>${esc(l.company)}</td><td>${esc(l.location||'')}</td><td class="muted">${esc(streamName(l.job_stream_id))}</td><td class="muted">${esc(l.job_boards?.name||l.source_platform||'')}</td><td class="${stale?'tag warn':''}">${age==null?'':age+' d'}${l.posted_at_basis==='email_received'?'<span class="muted" title="posting date not in the alert; email date used">*</span>':''}</td><td>${l.easy_apply?'yes':''}</td><td>${know?`<span class="tag ok">${know}</span>`:''}</td>
    <td style="white-space:nowrap"><button class="small act" data-a="apply" data-id="${l.id}">Apply</button> <button class="small act" data-a="tailor" data-id="${l.id}">Tailor</button> <button class="small act" data-a="park" data-id="${l.id}">Park</button> ${l.url?`<a class="btn small" href="${esc(l.url)}" target="_blank" rel="noopener">Open</a>`:''}</td></tr>`; }).join('') || '<tr><td colspan="10" class="muted">No open leads. Add one, or wait for the next sourcing run.</td></tr>';
    $('#inboxRows').querySelectorAll('tr.row').forEach(tr=>tr.onclick=e=>{ if (e.target.closest('button,a')) return; const l=leads.find(x=>x.id===tr.dataset.id); editRecord({table:'leads',title:'Lead',fields:F.lead,row:l,after:()=>go('inbox')}); });
    $('#inboxRows').querySelectorAll('button.act').forEach(b=>b.onclick=()=>leadAction(b.dataset.a, leads.find(x=>x.id===b.dataset.id)));
  };
  draw(); $('#inboxFilter').oninput=draw;
  $('#newLead').onclick=()=>editRecord({table:'leads',title:'New lead',fields:F.lead,row:null,defaults:{job_stream_id:selStreams()[0]||PM_STREAM,status:'new',posted_at_basis:'listing'},after:()=>go('inbox')});
  $('#showParked').onclick=()=>renderParked(el);
}
async function renderParked(el){
  const leads = await q(inStreams(sb.from('leads').select('*, job_boards(name), noise_reasons(reason)').in('status',['parked','noise'])).order('created_at',{ascending:false}).limit(300));
  el.innerHTML = `<h2>Parked leads <span class="muted" style="font-weight:400;font-size:14px">${leads.length}</span></h2><div class="toolbar"><button id="back">← Inbox</button></div>
  <div class="scroll"><table><thead><tr><th>Title</th><th>Company</th><th>Reason</th><th>Fit</th><th>Seen</th><th></th></tr></thead><tbody>${leads.map(l=>`<tr class="row" data-id="${l.id}"><td>${esc(l.title)}</td><td>${esc(l.company)}</td><td class="muted">${esc(l.noise_reasons?.reason||l.status)}</td><td>${l.fit_score==null?'':Math.round(l.fit_score)}</td><td>${fmtD(l.created_at)}</td><td><button class="small un" data-id="${l.id}">Unpark</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nothing parked.</td></tr>'}</tbody></table></div>`;
  $('#back').onclick=()=>go('inbox');
  el.querySelectorAll('tr.row').forEach(tr=>tr.onclick=e=>{ if (e.target.closest('button')) return; editRecord({table:'leads',title:'Lead',fields:F.lead,row:leads.find(x=>x.id===tr.dataset.id),after:()=>renderParked(el)}); });
  el.querySelectorAll('button.un').forEach(b=>b.onclick=async()=>{ await q(sb.from('leads').update({status:'new',noise_reason_id:null}).eq('id',b.dataset.id)); renderParked(el); });
}
async function leadAction(a, l){
  if (a==='park'){
    const opts = state.noise.map(n=>`<option value="${n.id}">${esc(n.reason)}</option>`).join('');
    openModal(`<h3>Park: ${esc(l.title)}</h3><label>Reason</label><select id="parkReason">${opts}</select><div class="actions"><button class="primary" id="ok">Park</button><button id="no">Cancel</button></div>`);
    $('#no').onclick=closeModal; $('#ok').onclick=async()=>{ await q(sb.from('leads').update({status:'parked',noise_reason_id:$('#parkReason').value}).eq('id',l.id)); closeModal(); toast('Parked'); go('inbox'); };
    return;
  }
  // apply or tailor: create the application from the lead
  const decision = a==='tailor'?'tailored':'generic';
  const stream = state.streams.find(s=>s.id===l.job_stream_id) || state.streams[0];
  const docs = await q(sb.from('documents').select('id,version_label,tag,type').eq('job_stream_id', stream.id).order('created_at'));
  const generic = docs.find(d=>d.id===stream.generic_document_id) || docs.find(d=>d.tag==='generic'&&d.type==='resume');
  openModal(`<h3>${decision==='tailored'?'Tailor and apply':'Apply with generic resume'}: ${esc(l.title)} at ${esc(l.company)}</h3>
    <div class="grid2"><div><label>Apply channel</label><select id="ch"><option ${l.easy_apply?'selected':''}>easy_apply</option><option ${!l.easy_apply?'selected':''}>website</option><option>email</option><option>consultant</option><option>referral</option></select></div>
    <div><label>Applied date</label><input id="ad" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div>
    <label>Why ${decision}</label><textarea id="why" placeholder="${decision==='tailored'?'which must-haves the generic resume does not lead with':'the generic resume already leads with what they ask for'}"></textarea>
    ${decision==='tailored'?`<div class="callout">A tailored copy of ${esc(generic?generic.version_label:'the generic resume')} will be created in the library (tag tailored, company ${esc(l.company)}, status draft) for you to edit, and linked to this application.</div>`:`<div class="callout">${generic?esc(generic.version_label):'No generic resume on this stream yet'} will be linked as the document sent.</div>`}
    <div class="actions"><button class="primary" id="ok">Create application</button><button id="no">Cancel</button></div><div class="err" id="e"></div>`);
  $('#no').onclick=closeModal;
  $('#ok').onclick=async()=>{ try{
    const app = await q(sb.from('applications').insert({lead_id:l.id, job_stream_id:l.job_stream_id, title:l.title, company:l.company, location:l.location, url:l.url, job_board_id:l.job_board_id, source_platform:l.source_platform, status:'applied', applied_date:$('#ad').value||null, apply_channel:$('#ch').value, resume_decision:decision, decision_reason:$('#why').value||null, fit_score:l.fit_score, fit_breakdown:l.fit_breakdown, needs_tailored_resume:decision==='tailored', final_status:'open'}).select().single());
    await q(sb.from('leads').update({status:'promoted', promoted_application_id:app.id}).eq('id', l.id));
    await q(sb.from('status_history').insert({application_id:app.id, from_status:null, to_status:'applied', changed_at:new Date().toISOString(), cause:'manual', message_text:'Created from inbox'}));
    let docId = generic?generic.id:null;
    if (decision==='tailored' && generic){ const full = await q(sb.from('documents').select('text').eq('id',generic.id).single()); const d = await q(sb.from('documents').insert({job_stream_id:stream.id, type:'resume', tag:'tailored', tailored_for_company:l.company, derived_from_document_id:generic.id, version_label:`Tailored · ${l.company} · ${new Date().toISOString().slice(0,10)}`, text:full.text, status:'draft'}).select().single()); docId=d.id; }
    if (docId) await q(sb.from('application_documents').insert({application_id:app.id, document_id:docId, role:'resume', sent_at:decision==='generic'?new Date().toISOString():null}));
    state.cache={}; closeModal(); toast('Application created'); openApplication(app.id);
  }catch(e){ $('#e').textContent=e.message||e; } };
}

async function openApplication(id, tab='overview'){
  const a = await q(sb.from('applications').select('*, job_boards(name), consultant_organizations(name), leads!applications_lead_id_fkey(url,jd_text,raw_snippet,fit_breakdown)').eq('id',id).single());
  const [docs, people, outs, rounds, hist, pm] = await Promise.all([
    q(sb.from('application_documents').select('*, documents(version_label,tag,type,status,tailored_for_company)').eq('application_id',id)),
    q(sb.from('application_contacts').select('*, contacts(name,type,organization,email,linkedin_url)').eq('application_id',id)),
    q(sb.from('outreach').select('*, contacts(name)').eq('application_id',id).order('created_at')),
    q(sb.from('interviews').select('*').eq('application_id',id).order('round_number')),
    q(sb.from('status_history').select('*').eq('application_id',id).order('changed_at')),
    q(sb.from('post_mortems').select('*').eq('application_id',id).maybeSingle()),
  ]);
  const tabs=['overview','documents','people','outreach','rounds','timeline','post-mortem'];
  const fb = a.fit_breakdown || a.leads?.fit_breakdown;
  let body='';
  if (tab==='overview') body = `<div class="grid2"><div><p><b>${esc(a.company)}</b> · ${esc(a.title)}<br><span class="muted">${esc(a.location||'')} · ${esc(streamName(a.job_stream_id))} · via ${esc(a.job_boards?.name||a.apply_channel||'')}${a.consultant_organizations?' · agency '+esc(a.consultant_organizations.name):''}</span></p>

  if (tab==='rounds') body = `<table><thead><tr><th>Round</th><th>Stage</th><th>Date</th><th>Interviewer</th><th>Result</th><th>Went</th><th>Debrief</th></tr></thead><tbody>${rounds.map(r=>`<tr class="row" data-id="${r.id}"><td>${r.round_number}</td><td>${esc(r.stage_label||'')}</td><td>${fmtD(r.interview_date)}</td><td>${esc(r.interviewer_name||'')}</td><td>${esc(r.result||'')}</td><td>${r.how_it_went??''}</td><td>${r.debriefed_at?'<span class="tag ok">done</span>':'<span class="tag warn">pending</span>'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No rounds yet.</td></tr>'}</tbody></table><div class="actions"><button id="addRound">+ Round</button></div>`;

  if ($('#addPerson')) $('#addPerson').onclick=()=>editRecord({table:'application_contacts',title:'Link person',fields:F.appcontact,row:null,defaults:{_force:{application_id:id}},after:re});

  if ($('#addOut')) $('#addOut').onclick=()=>editRecord({table:'outreach',title:'Outreach',fields:F.outreach,row:null,defaults:{status:'sent',sent_at:new Date().toISOString(),_force:{application_id:id}},after:re});
  if ($('#addRound')) $('#addRound').onclick=()=>editRecord({table:'interviews',title:'Interview round',fields:F.interview.filter(f=>f.k!=='application_id'),row:null,defaults:{round_number:rounds.length+1,result:'pending',_force:{application_id:id}},after:re});

  });
}
async function changeStatus(a, after){
  openModal(`<h3>Change status: ${esc(a.company)}</h3><label>New status</label><select id="ns">${STATUSES.map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select><label>Cause</label><select id="cause"><option>manual</option><option>email</option><option>call</option><option>wispr</option></select><label>What they said (paste the message, verbatim)</label><textarea id="msg"></textarea><div class="actions"><button class="primary" id="ok">Save</button><button id="no">Cancel</button></div><div class="err" id="e"></div>`);
  $('#no').onclick=after;
  $('#ok').onclick=async()=>{ try{ const ns=$('#ns').value, msg=$('#msg').value||null, now=new Date().toISOString(); const upd={status:ns, updated_at:now};
    if (['rejected','withdrawn','ghosted','offer'].includes(ns)) { upd.final_status=ns; upd.closed_at=now; if (ns==='rejected'&&msg){ upd.rejection_message=msg; upd.rejection_received_at=now; } }
    await q(sb.from('applications').update(upd).eq('id',a.id));
    await q(sb.from('status_history').insert({application_id:a.id, from_status:a.status, to_status:ns, changed_at:now, cause:$('#cause').value, message_text:msg}));
    if (ns==='rejected'){ const pm = await q(sb.from('post_mortems').select('id').eq('application_id',a.id).maybeSingle()); if(!pm){ const n = await q(sb.from('interviews').select('id',{count:'exact',head:true}).eq('application_id',a.id)); await q(sb.from('post_mortems').insert({application_id:a.id, final_status:'rejected', rounds_reached:n?.length??0, written_by:'you'})); } }
    toast('Status updated'); after(); }catch(e){ $('#e').textContent=e.message||e; } };
}

  el.innerHTML = `<h2>Job streams</h2><div class="toolbar"><button id="newS">+ Stream</button><button id="newA">+ Alert</button></div><div class="cards">${state.streams.map(s=>{ const n=leadCounts[s.id]; const ok = n >= (s.min_leads||0); const al=alerts.filter(a=>a.job_stream_id===s.id);

  el.querySelectorAll('tr.al').forEach(r=>r.onclick=()=>editRecord({table:'alert_definitions',title:'Alert',fields:F.alert,row:alerts.find(a=>a.id===r.dataset.id),after:()=>go('streams')}));

function importConnections(){
  openModal(`<h3>Import LinkedIn connections</h3><p class="muted">LinkedIn → Settings → Data privacy → Get a copy of your data → Connections. Upload the Connections.csv here. Existing rows are replaced.</p><input type="file" id="csv" accept=".csv,text/csv"><div class="actions"><button class="primary" id="ok">Import</button><button id="no">Cancel</button></div><div class="err" id="e"></div>`);
  $('#no').onclick=closeModal;
  $('#ok').onclick=async()=>{ try{ const f=$('#csv').files[0]; if(!f) throw new Error('Choose the file first'); const text=await f.text(); const rows=parseCsv(text); const hi=rows.findIndex(r=>r.some(c=>/first name/i.test(c))); if(hi<0) throw new Error('No "First Name" header found; is this the Connections export?'); const h=rows[hi].map(c=>c.trim().toLowerCase()); const idx=n=>h.findIndex(x=>x===n);
      const recs=rows.slice(hi+1).filter(r=>r.length>=3&&r[idx('first name')]).map(r=>({first_name:r[idx('first name')], last_name:r[idx('last name')], company:r[idx('company')]||null, company_normalised:normCo(r[idx('company')]), position:r[idx('position')]||null, linkedin_url:r[idx('url')]||null, connected_on:parseLiDate(r[idx('connected on')]), imported_at:new Date().toISOString()}));
      await q(sb.from('connections').delete().neq('id','00000000-0000-0000-0000-000000000000'));
      for (let i=0;i<recs.length;i+=500) await q(sb.from('connections').insert(recs.slice(i,i+500)));
      closeModal(); toast(recs.length+' connections imported'); go('people'); }catch(e){ $('#e').textContent=e.message||e; } };
}
function parseCsv(t){ const rows=[]; let row=[], cur='', inq=false; for (let i=0;i<t.length;i++){ const c=t[i]; if (inq){ if (c==='"'){ if (t[i+1]==='"'){cur+='"'; i++;} else inq=false; } else cur+=c; } else { if (c==='"') inq=true; else if (c===','){ row.push(cur); cur=''; } else if (c==='\n'||c==='\r'){ if (c==='\r'&&t[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=c; } } if (cur!==''||row.length){ row.push(cur); rows.push(row); } return rows; }
function parseLiDate(s){ if(!s) return null; const d=new Date(s); return isNaN(d)?null:d.toISOString().slice(0,10); }

  const appIds=new Set(apps.map(a=>a.id)); const r=rounds.filter(x=>appIds.has(x.application_id));
  const withInt = new Set(r.map(x=>x.application_id)).size;

    <div class="kpi"><b>${apps.filter(a=>a.final_status==='rejected').length} / ${apps.filter(a=>a.final_status==='offer').length}</b><span>rejected / offers</span></div></div>
  <div class="grid2"><div><h3>Applications per week</h3><table><tbody>${Object.entries(weeks).sort().map(([k,v])=>`<tr><td class="mono">${k}</td><td>${'▇'.repeat(Math.min(v,40))} ${v}</td></tr>`).join('')||'<tr><td class="muted">none yet</td></tr>'}</tbody></table></div>

/* ===================== Agents (v1.0.5) ===================== */
// One row per agent in public.agents. The runner (v1.0.8+) reads this table on every pass.
// Prompt and fitment edits are saved as NEW versions (never overwritten) and only take effect once activated.
// agRubricText / agRenderSystem / agComputeFit must stay identical to render_rubric / render_system / compute_fit in runner/job_driver_runner.py.
const AG_RUN_NAMES = {sourcer:['sourcer+fit'], fit:['sourcer+fit'], notifier:['notifier','replies'], status_sync:['status_sync'], sweeps:['sweeps']};
const AG_BANDS = {strong:{min:80,max:100,label:'Strong · 80–100',push:true}, plausible:{min:60,max:79,label:'Plausible · 60–79',push:true}, stretch:{min:40,max:59,label:'Stretch · 40–59',push:false}, no:{min:0,max:39,label:'No · 0–39',push:false}};
const AG_MARK = {fit:'SCORE_FIT.', sourcer:'EXTRACT_JOBS.', status_sync:'CLASSIFY_STATUS.'};
const AG_OUT = {
  fit: 'Output format (fixed by the system): JSON only, no prose.\n{"scores":[{"index":<int>,"params":{"<parameter key>":{"score":<0-100 or null>,"why":"<under 120 chars>"}},"basis":"title_only | snippet | jd","note":"<under 120 chars>"}]}\nOne entry per job. Include every parameter key listed above.',
  sourcer: 'Output format (fixed by the system): JSON only.\n{"is_job_alert": true|false, "jobs": [{"title","company","location","url","easy_apply": true|false|null,"posted_text": "as written, e.g. 2 days ago, or null","snippet": "<=200 chars","stream": "one of the stream names, or null"}]}',
  status_sync: 'Output format (fixed by the system): JSON only.\n{"outcome": "rejected|interview_invite|offer|assessment|acknowledgement|other", "company": "<name>", "verbatim": "<exact sentences, or empty>", "confidence": <0-1>}'
};
function agRubricText(rub){
  const L=[];
  for (const p of (rub?.params||[])) {
    if (p.enabled===false) continue;
    const a=p.anchors||{};
    L.push(`- ${p.name} (key "${p.key}", weight ${p.weight}): ${p.description||''}`);
    L.push(`    about 90: ${a.high||''}`); L.push(`    about 50: ${a.mid||''}`); L.push(`    about 10: ${a.low||''}`);
    if (p.cap && p.cap.below!=null && p.cap.max!=null) L.push(`    Hard cap: if this is below ${p.cap.below}, the total cannot be above ${p.cap.max} (applied by the system).`);
    L.push('    If you cannot judge it: return null.' + (p.if_unknown==='skip' ? ' It is then left out of the total.' : ' It is then scored 50.'));
  }
  return L.join('\n');
}
function agStreamsDesc(streams){ return streams.map(s=>`- "${s.name}": goal=${s.goal||''}; target titles=${(s.target_titles||[]).join(', ')}`).join('\n'); }
function agRenderSystem(key, template, ctx){
  let body = template||'';
  if (key==='fit') body = body.split('{{rubric}}').join(agRubricText(ctx.rubric)).split('{{threshold}}').join(String(ctx.rubric?.threshold ?? 60));
  if (key==='sourcer') body = body.split('{{streams}}').join(agStreamsDesc(ctx.streams||[]));
  return (AG_MARK[key] ? AG_MARK[key]+'\n' : '') + body + (AG_OUT[key] ? '\n\n'+AG_OUT[key] : '');
}
// Same maths as compute_fit() in the runner: weighted mean of parameter scores, if-unknown rule, then caps.
function agComputeFit(rub, params){
  let tot=0, w=0; const caps=[];
  for (const p of (rub.params||[])) { if (p.enabled===false) continue;
    let s = params?.[p.key]?.score; s = (s===null||s===undefined||s==='') ? null : Math.max(0, Math.min(100, Number(s)));
    if (s===null) { if (p.if_unknown==='skip') continue; s=50; }
    tot += Number(p.weight)*s; w += Number(p.weight); }
  let total = w ? Math.round(tot/w) : null;
  for (const p of (rub.params||[])) { if (p.enabled===false||!p.cap||p.cap.below==null) continue; const s=params?.[p.key]?.score;
    if (s!=null && s!=='' && Number(s) < Number(p.cap.below) && total!=null && total > Number(p.cap.max)) { total = Number(p.cap.max); caps.push(p.key); } }
  return {total, caps};
}
const agSched = s => s?.mode==='every_n_hours' ? `every ${s.hours||4} h` : s?.mode==='nightly' ? 'nightly (after 21:36 IST)' : 'every runner pass (~2 h)';
const agModel = m => !m || m.primary==='none' ? 'no AI' : `${m.primary}${m.fallback&&m.fallback!=='none'?' → '+m.fallback:''}`;
const agTag = b => b==='live'?'<span class="tag ok">live</span>':b==='degraded'?'<span class="tag warn">degraded</span>':'<span class="tag">not built</span>';
const agState = { tab:'overview' };

    Prompt and fitment edits are saved as new versions and only go live when you activate them.</div>

        <div class="muted" style="margin:6px 0;font-size:13px">${esc(a.description||'')}</div>
        <div class="mono muted">${a.built_status==='not_built'?'—':`${a.enabled?'<span class="tag ok">on</span>':'<span class="tag bad">off</span>'} · ${esc(agSched(a.schedule))} · ${esc(agModel(a.model))}${pv?` · prompt v${pv.version}`:''}`}</div>
        <div class="mono muted" style="margin-top:4px">${r?`last run ${fmtDT(r.started_at)}${r.errors?' · <span style="color:var(--bad)">errors</span>':''}`:a.built_status==='not_built'?'':'no runs yet'}</div>

async function openAgent(id, tab){
  const a = await q(sb.from('agents').select('*').eq('id',id).single());
  if (agState.a && agState.a.id!==id) { agState.pv=null; agState.rv=null; }
  agState.a = a; agState.tab = tab || 'overview';
  const tabs = [['overview','Overview'], ['schedule','Schedule & model']];
  if (AG_MARK[a.key]) tabs.push(['prompt','Prompt']);
  if (a.key==='fit') tabs.push(['rubric','Fitment']);
  tabs.push(['guardrails','Guardrails']);
  if (a.key==='fit') tabs.push(['evals','Evals']);
  if (!tabs.find(t=>t[0]===agState.tab)) agState.tab='overview';
  openModal(`<div style="display:flex;align-items:center;gap:8px"><h3 style="flex:1">${a.design_no?`#${a.design_no} · `:''}${esc(a.name)}</h3>${agTag(a.built_status)}<button class="small" id="agClose">Close</button></div>
    <div class="tabs" id="agTabs">${tabs.map(([k,l])=>`<button data-t="${k}" class="${k===agState.tab?'active':''}">${l}</button>`).join('')}</div><div id="agBody"><div class="muted">Loading…</div></div>`);
  $('#modal').style.maxWidth='1120px';
  $('#agClose').onclick=()=>{ closeModal(); $('#modal').style.maxWidth=''; if (state.screen==='agents') go('agents'); };
  $('#agTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>openAgent(id, b.dataset.t));
  const body = $('#agBody');
  try { await ({overview:agOverview, schedule:agSchedule, prompt:agPrompt, rubric:agRubric, guardrails:agGuardrails, evals:agEvals})[agState.tab](a, body); }

async function agEvalFor(versionField, versionId){
  const runs = await q(sb.from('agent_eval_runs').select('id,total,decision_agreement,prompt_version_id,rubric_version_ids,finished_at').eq('agent_id',agState.a.id).eq('status','done').order('finished_at',{ascending:false}).limit(50));
  return runs.find(r => versionField==='prompt' ? r.prompt_version_id===versionId : Object.values(r.rubric_version_ids||{}).includes(versionId));
}
function agPassesGate(run){ const g=agState.a.eval_gate||{}; return run && (run.total||0) >= (g.min_cases??10) && Number(run.decision_agreement||0) >= (g.min_agreement??80); }
async function agGateConfirm(what, versionField, versionId){
  if (agState.a.key!=='fit') return confirmBox(`This agent has no evals yet. Activate ${what}?`);
  const r = await agEvalFor(versionField, versionId);
  if (agPassesGate(r)) return true;
  const g=agState.a.eval_gate||{};
  return confirmBox(r ? `${what} last scored ${Math.round(r.decision_agreement)}% decision agreement on ${r.total} cases. The gate is ${g.min_agreement??80}% on at least ${g.min_cases??10}. Activate anyway?`
                      : `${what} has no finished eval run yet. Queue one on the Evals tab first, or activate anyway?`);
}

async function agRubric(a, el){
  const streams = state.streams;
  const sid = agState.rs && streams.find(s=>s.id===agState.rs) ? agState.rs : streams[0].id; agState.rs=sid;
  const stream = streams.find(s=>s.id===sid);
  const vs = await q(sb.from('fit_rubric_versions').select('*').eq('job_stream_id',sid).order('version',{ascending:false}));
  const sel = vs.find(v=>v.id===agState.rv) || vs.find(v=>v.id===stream.fit_rubric_version_id) || vs[0];
  const rub = JSON.parse(JSON.stringify(sel?.rubric || {threshold:60, params:[]}));
  el.innerHTML = `<div class="toolbar"><label style="margin:0">Stream</label><select id="rbS" style="width:auto">${streams.map(s=>`<option value="${s.id}" ${s.id===sid?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
      <label style="margin:0">Version</label><select id="rbV" style="width:auto">${vs.map(v=>`<option value="${v.id}" ${v.id===sel?.id?'selected':''}>v${v.version}${v.id===stream.fit_rubric_version_id?' · active':''}</option>`).join('')}</select>
      ${sel && sel.id!==stream.fit_rubric_version_id?`<button class="small" id="rbAct">Activate v${sel.version}</button>`:'<span class="tag ok">active</span>'}</div>
    <div class="callout">Fitment = a weighted average of these parameters. The AI scores each parameter 0–100 against the three anchors. The system does the maths, applies the caps, and parks anything below the threshold. Weights are relative; they do not need to add up to 100.</div>
    <div class="ag-split"><div>
      <div id="rbParams"></div>
      <div class="actions"><button id="rbAdd">+ Add parameter</button></div>
      <div class="grid2"><div><label for="rbThr">Threshold: push at or above</label><input id="rbThr" type="number" min="0" max="100" value="${rub.threshold??60}"></div><div><label for="rbNotes">What changed</label><input id="rbNotes" placeholder="e.g. location cap raised to 60"></div></div>
      <div class="actions"><button class="primary" id="rbSave">Save as new version (draft)</button></div><div class="err" id="rbErr"></div>
      <h3>Try it</h3><p class="muted" style="font-size:13px">Type parameter scores to see the total this rubric gives, caps included. Leave a box empty for "cannot judge".</p><div id="rbTry"></div><div id="rbTryOut" class="mono" style="margin-top:6px"></div>
    </div><div><label>How this reaches the AI ({{rubric}} in the prompt)</label><pre class="text" id="rbPrev" style="max-height:640px;font-family:var(--mono);font-size:12px"></pre></div></div>`;
  const prev = () => { $('#rbPrev').textContent = agRubricText(rub) + `\n\nThreshold: ${rub.threshold}`; };
  const tryDraw=()=>{ $('#rbTry').innerHTML = rub.params.filter(p=>p.enabled!==false).map(p=>`<span style="display:inline-flex;gap:4px;align-items:center;margin:0 10px 6px 0"><span class="mono muted">${esc(p.key)}</span><input class="rbT" data-k="${esc(p.key)}" type="number" min="0" max="100" placeholder="?" style="width:62px"></span>`).join('');
    const calc=()=>{ const ps={}; $('#rbTry').querySelectorAll('.rbT').forEach(x=>ps[x.dataset.k]={score:x.value===''?null:Number(x.value)}); const r=agComputeFit(rub, ps); $('#rbTryOut').innerHTML = `Total <b>${r.total??'—'}</b> · ${r.total!=null&&r.total>=Number(rub.threshold)?'<span class="tag ok">push</span>':'<span class="tag">park</span>'}${r.caps.length?` · capped by ${esc(r.caps.join(', '))}`:''}`; };
    $('#rbTry').querySelectorAll('.rbT').forEach(x=>x.oninput=calc); calc(); };
  const draw = () => {
    const wsum = rub.params.filter(p=>p.enabled!==false).reduce((s,p)=>s+Number(p.weight||0),0)||1;
    $('#rbParams').innerHTML = rub.params.map((p,i)=>`<div class="card" style="margin-bottom:10px" data-i="${i}">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input type="checkbox" class="rbEn" style="width:auto" ${p.enabled!==false?'checked':''} title="Use this parameter">
        <input class="rbName" value="${esc(p.name)}" style="flex:2;min-width:140px" placeholder="Name">
        <input class="rbKey mono" value="${esc(p.key)}" style="flex:1;min-width:110px" placeholder="key">
        <span class="muted mono">weight</span><input class="rbW" type="number" min="0" value="${p.weight}" style="width:70px">
        <span class="tag ${p.enabled!==false?'new':''} rbShare">${p.enabled!==false?Math.round(100*Number(p.weight||0)/wsum):0}% of score</span>
        <button class="small rbDel" style="margin-left:auto;color:var(--bad)">Remove</button></div>
      <label>Description: what this parameter judges</label><textarea class="rbDesc" style="min-height:40px">${esc(p.description||'')}</textarea>
      <div class="grid2 ag-3"><div><label>Scores about 90 when</label><textarea class="rbHi" style="min-height:52px">${esc(p.anchors?.high||'')}</textarea></div><div><label>About 50 when</label><textarea class="rbMid" style="min-height:52px">${esc(p.anchors?.mid||'')}</textarea></div><div><label>About 10 when</label><textarea class="rbLo" style="min-height:52px">${esc(p.anchors?.low||'')}</textarea></div></div>
      <div class="grid2"><div><label>Hard cap (blank = none)</label><div style="display:flex;gap:6px;align-items:center"><span class="muted">if below</span><input class="rbCb" type="number" value="${p.cap?.below??''}" style="width:70px"><span class="muted">total at most</span><input class="rbCm" type="number" value="${p.cap?.max??''}" style="width:70px"></div></div>
        <div><label>If the AI cannot judge it</label><select class="rbUnk"><option value="neutral" ${p.if_unknown!=='skip'?'selected':''}>Score it 50 (neutral)</option><option value="skip" ${p.if_unknown==='skip'?'selected':''}>Leave it out and re-weight the rest</option></select></div></div>
    </div>`).join('') || '<div class="muted">No parameters.</div>';
    $('#rbParams').querySelectorAll('.card').forEach(c=>{ const i=Number(c.dataset.i), p=rub.params[i];
      const rd=()=>{ p.enabled=c.querySelector('.rbEn').checked; p.name=c.querySelector('.rbName').value; p.key=c.querySelector('.rbKey').value.trim(); p.weight=Number(c.querySelector('.rbW').value||0); p.description=c.querySelector('.rbDesc').value;
        p.anchors={high:c.querySelector('.rbHi').value, mid:c.querySelector('.rbMid').value, low:c.querySelector('.rbLo').value};
        const cb=c.querySelector('.rbCb').value, cm=c.querySelector('.rbCm').value; p.cap = (cb!==''&&cm!=='') ? {below:Number(cb), max:Number(cm)} : null; p.if_unknown=c.querySelector('.rbUnk').value; prev(); };
      c.querySelectorAll('input,textarea,select').forEach(x=>x.addEventListener('input',rd));
      c.querySelectorAll('.rbEn,.rbW,.rbUnk,.rbKey,.rbCb,.rbCm').forEach(x=>x.addEventListener('change',()=>{ rd(); draw(); tryDraw(); }));
      c.querySelector('.rbDel').onclick=()=>{ rub.params.splice(i,1); draw(); prev(); tryDraw(); }; });
  };
  draw(); prev(); tryDraw();
  $('#rbS').onchange=()=>{ agState.rs=$('#rbS').value; agState.rv=null; openAgent(a.id,'rubric'); };
  $('#rbV').onchange=()=>{ agState.rv=$('#rbV').value; openAgent(a.id,'rubric'); };
  $('#rbThr').oninput=()=>{ rub.threshold=Number($('#rbThr').value); prev(); tryDraw(); };
  $('#rbAdd').onclick=()=>{ rub.params.push({key:'param_'+(rub.params.length+1), name:'New parameter', weight:10, enabled:true, description:'', anchors:{high:'',mid:'',low:''}, cap:null, if_unknown:'neutral'}); draw(); prev(); tryDraw(); };
  $('#rbSave').onclick=async()=>{ try{
      const keys=rub.params.map(p=>p.key); if (!rub.params.filter(p=>p.enabled!==false).length) throw new Error('Turn on at least one parameter.');
      if (keys.some(k=>!/^[a-z][a-z0-9_]{1,30}$/.test(k))) throw new Error('Keys must be lowercase letters, digits or _ (e.g. role_level).');
      if (new Set(keys).size!==keys.length) throw new Error('Two parameters share a key.');
      for (const p of rub.params) { if (p.enabled===false) continue; if (!(p.weight>0)) throw new Error(`${p.name}: weight must be above 0.`); if (!p.anchors.high||!p.anchors.mid||!p.anchors.low) throw new Error(`${p.name}: fill all three anchors. They are what the AI scores against.`);
        if (p.cap && (p.cap.max<0||p.cap.max>100||p.cap.below<0||p.cap.below>100)) throw new Error(`${p.name}: cap numbers must be 0–100.`); }
      if (!(rub.threshold>=0&&rub.threshold<=100)) throw new Error('Threshold must be 0–100.');
      if (sel && JSON.stringify(rub)===JSON.stringify(sel.rubric)) throw new Error('No change from v'+sel.version+'.');
      const next=(vs[0]?.version||0)+1; const v=await q(sb.from('fit_rubric_versions').insert({job_stream_id:sid, version:next, rubric:rub, notes:$('#rbNotes').value||null}).select().single());
      agState.rv=v.id; toast(`Saved fitment v${next} for ${stream.name} as a draft`); openAgent(a.id,'rubric'); }catch(e){ $('#rbErr').textContent=e.message||e; } };
  if ($('#rbAct')) $('#rbAct').onclick=async()=>{ const ok=await agGateConfirm(`Fitment v${sel.version} (${stream.name})`,'rubric',sel.id); if(!ok){ openAgent(a.id,'rubric'); return; }
    try{ await q(sb.from('job_streams').update({fit_rubric_version_id:sel.id}).eq('id',sid)); state.streams = await q(sb.from('job_streams').select('*').order('created_at')); toast(`Fitment v${sel.version} is live for ${stream.name} from the next run`); openAgent(a.id,'rubric'); }catch(e){ err(e); } };
}

async function agEvals(a, el){
  const [cases, runs, pvs, rvs] = await Promise.all([
    q(sb.from('agent_evals').select('*').eq('agent_id',a.id).order('created_at')),
    q(sb.from('agent_eval_runs').select('id,status,requested_at,finished_at,prompt_version_id,rubric_version_ids,total,decision_pass,band_pass,decision_agreement,band_agreement,model,error').eq('agent_id',a.id).order('requested_at',{ascending:false}).limit(20)),
    q(sb.from('agent_prompt_versions').select('id,version').eq('agent_id',a.id).order('version',{ascending:false})),
    q(sb.from('fit_rubric_versions').select('id,version,job_stream_id').order('version',{ascending:false}))]);
  const g = a.eval_gate||{min_agreement:80,min_cases:10};
  const passes = r => Number(r.decision_agreement)>=(g.min_agreement??80) && (r.total||0)>=(g.min_cases??10);
  const nLab = () => cases.filter(c=>c.is_active && c.expected_band).length;
  const lastDone = runs.find(r=>r.status==='done');
  const lastRes = lastDone ? ((await q(sb.from('agent_eval_runs').select('results').eq('id',lastDone.id).single())).results||[]) : [];
  const pvN = id => (pvs.find(v=>v.id===id)||{}).version, rvN = id => (rvs.find(v=>v.id===id)||{}).version;
  const sn = id => streamName(id)||'—';
  el.innerHTML = `<div class="grid2"><div>
      <h3 style="margin-top:0">How evals work</h3>
      <p style="font-size:13.5px">Each case is a job you label with the band you think it belongs in. An eval run scores every labelled case with the chosen prompt and fitment versions, then compares.
      <b>Decision agreement</b>: the system's push or park matches your label (Strong and Plausible mean push). <b>Band agreement</b>: the score lands inside your band.</p>
      <h3>Gate for going live</h3>
      <div class="grid2"><div><label for="egA">Min decision agreement, %</label><input id="egA" type="number" value="${g.min_agreement??80}"></div><div><label for="egC">Min labelled cases</label><input id="egC" type="number" value="${g.min_cases??10}"></div></div>
      <div class="actions"><button id="egSave">Save gate</button></div>
    </div><div>
      <h3 style="margin-top:0">Queue an eval run</h3>
      <label for="erP">Prompt version</label><select id="erP">${pvs.map(v=>`<option value="${v.id}" ${v.id===a.active_prompt_version_id?'selected':''}>v${v.version}${v.id===a.active_prompt_version_id?' · active':''}</option>`).join('')}</select>
      ${state.streams.map(s=>`<label>Fitment version · ${esc(s.name)}</label><select class="erR" data-s="${s.id}">${rvs.filter(v=>v.job_stream_id===s.id).map(v=>`<option value="${v.id}" ${v.id===s.fit_rubric_version_id?'selected':''}>v${v.version}${v.id===s.fit_rubric_version_id?' · active':''}</option>`).join('')}</select>`).join('')}
      <div class="actions"><button class="primary" id="erGo" ${nLab()?'':'disabled'}>Queue eval run (${nLab()} labelled cases)</button></div>
      <div class="muted" style="font-size:13px">Runs on the runner's next pass (up to 2 hours). Uses about ${Math.max(1,Math.ceil(nLab()/(a.max_items||8)))} AI calls from the same free quota. Unlabelled cases are skipped.</div><div class="err" id="erErr"></div>
    </div></div>
    <h3>Eval runs</h3><div class="scroll"><table><thead><tr><th>Requested</th><th>Status</th><th>Prompt</th><th>Fitment</th><th>Cases</th><th>Decision</th><th>Band</th><th>Model</th></tr></thead><tbody>
      ${runs.map(r=>`<tr class="row erRow" data-id="${r.id}"><td>${fmtDT(r.requested_at)}</td><td>${r.status==='done'?'<span class="tag ok">done</span>':r.status==='failed'?`<span class="tag bad" title="${esc(r.error||'')}">failed</span>`:`<span class="tag warn">${esc(r.status)}</span>`}</td>
        <td class="mono">v${pvN(r.prompt_version_id)??'?'}</td><td class="mono">${Object.entries(r.rubric_version_ids||{}).map(([s,id])=>`${esc(sn(s).split(' ')[0])} v${rvN(id)??'?'}`).join(', ')}</td><td>${r.total??''}</td>
        <td>${r.decision_agreement!=null?`<b style="color:${passes(r)?'var(--accent)':'var(--bad)'}">${Math.round(r.decision_agreement)}%</b> (${r.decision_pass}/${r.total})`:''}</td>
        <td>${r.band_agreement!=null?`${Math.round(r.band_agreement)}% (${r.band_pass}/${r.total})`:''}</td><td class="mono muted">${esc(r.model||'')}</td></tr>`).join('')||'<tr><td colspan="8" class="muted">No eval runs yet.</td></tr>'}</tbody></table></div>
    <div id="erDetail"></div>
    <h3 id="ecHead"></h3>
    <div class="toolbar"><button id="ecLeads">+ Add new leads</button><button id="ecApps">+ Add from applications</button><button id="ecMan">+ Add by hand</button><span class="grow"></span><select id="ecF" style="width:auto"><option value="unl">Unlabelled first</option><option value="all">All</option><option value="miss">Misses in last run</option></select></div>
    <div class="scroll"><table><thead><tr><th>Job</th><th>Stream</th><th>Your label</th><th>Last run</th><th></th></tr></thead><tbody id="ecBody"></tbody></table></div>`;
  const resBy = Object.fromEntries(lastRes.map(r=>[r.case_id, r]));
  const drawCases = () => {
    $('#ecHead').textContent = `Cases · ${nLab()} of ${cases.filter(c=>c.is_active).length} labelled`;
    $('#erGo').textContent = `Queue eval run (${nLab()} labelled cases)`; $('#erGo').disabled = !nLab();
    const f=$('#ecF').value; let list=cases.filter(c=>c.is_active);
    if (f==='unl') list=[...list.filter(c=>!c.expected_band), ...list.filter(c=>c.expected_band)];
    if (f==='miss') list=list.filter(c=>resBy[c.id] && !resBy[c.id].decision_pass);
    $('#ecBody').innerHTML = list.map(c=>{ const r=resBy[c.id], i=c.input||{};
      return `<tr data-id="${c.id}"><td><b>${esc(i.title||'')}</b> · ${esc(i.company||'')}<div class="muted" style="font-size:12.5px">${esc(i.location||'')}${c.note?' · '+esc(c.note):''}</div></td><td class="muted">${esc(sn(c.job_stream_id))}</td>
        <td style="white-space:nowrap">${Object.entries(AG_BANDS).map(([k,b])=>`<span class="chip ecB ${c.expected_band===k?'on':''}" data-b="${k}" title="${b.label}" style="margin:0 2px 2px 0">${k}</span>`).join('')}</td>
        <td>${r?`<span class="fit">${r.got??'—'}</span> ${r.decision_pass?'<span class="tag ok">agrees</span>':'<span class="tag bad">differs</span>'}${r.caps_applied?.length?` <span class="muted mono">cap ${esc(r.caps_applied.join(','))}</span>`:''}`:'<span class="muted">—</span>'}</td>
        <td><button class="small ecX" title="Remove from the eval set">✕</button></td></tr>`; }).join('') || '<tr><td colspan="5" class="muted">No cases.</td></tr>';
    $('#ecBody').querySelectorAll('tr[data-id]').forEach(tr=>{ const c=cases.find(x=>x.id===tr.dataset.id);
      tr.querySelectorAll('.ecB').forEach(ch=>ch.onclick=async()=>{ const b=ch.dataset.b===c.expected_band?null:ch.dataset.b; try{ await q(sb.from('agent_evals').update({expected_band:b, expected_min:b?AG_BANDS[b].min:null, expected_max:b?AG_BANDS[b].max:null}).eq('id',c.id)); c.expected_band=b; drawCases(); }catch(e){ err(e); } });
      tr.querySelector('.ecX').onclick=async()=>{ try{ await q(sb.from('agent_evals').update({is_active:false}).eq('id',c.id)); c.is_active=false; drawCases(); }catch(e){ err(e); } }; });
  };
  drawCases(); $('#ecF').onchange=drawCases;
  $('#egSave').onclick=async()=>{ try{ await agSave({eval_gate:{...g, min_agreement:Number($('#egA').value), min_cases:Number($('#egC').value), metric:'decision'}}, 'Gate saved'); }catch(e){ err(e); } };
  $('#erGo').onclick=async()=>{ try{ const rv={}; el.querySelectorAll('.erR').forEach(s=>{ if (s.value) rv[s.dataset.s]=s.value; });
      if (runs.some(r=>r.status==='queued'||r.status==='running')) { const ok=await confirmBox('An eval run is already waiting. Queue another one?'); if(!ok){ openAgent(a.id,'evals'); return; } }
      await q(sb.from('agent_eval_runs').insert({agent_id:a.id, prompt_version_id:$('#erP').value, rubric_version_ids:rv, status:'queued'})); toast('Queued. It runs on the next runner pass.'); openAgent(a.id,'evals'); }catch(e){ $('#erErr').textContent=e.message||e; } };
  el.querySelectorAll('.erRow').forEach(tr=>tr.onclick=async()=>{ const r=await q(sb.from('agent_eval_runs').select('*').eq('id',tr.dataset.id).single()); const res=(r.results||[]).slice().sort((x,y)=>(Number(!!x.decision_pass)-Number(!!y.decision_pass)));
    $('#erDetail').innerHTML = `<h3>Run of ${fmtDT(r.requested_at)}${r.error?` · <span style="color:var(--bad)">${esc(r.error)}</span>`:''}</h3><div class="scroll"><table><thead><tr><th>Job</th><th>Your band</th><th>Score</th><th>Decision</th><th>Band</th><th>Parameters</th><th>Basis / note</th></tr></thead><tbody>
      ${res.map(x=>`<tr><td>${esc(x.title||'')} · ${esc(x.company||'')}</td><td>${esc(x.expected_band||'')}</td><td class="fit">${x.got??'—'}${x.caps_applied?.length?`<div class="muted mono">cap ${esc(x.caps_applied.join(','))}</div>`:''}</td><td>${x.decision_pass?'✓':'<span style="color:var(--bad)">✗</span>'}</td><td>${x.band_pass?'✓':'✗'}</td>
        <td class="mono" style="font-size:11.5px">${Object.entries(x.params||{}).map(([k,v])=>`<div title="${esc(v?.why||'')}">${esc(k)} <b>${v?.score??'null'}</b> <span class="muted">${esc((v?.why||'').slice(0,60))}</span></div>`).join('')}</td><td class="muted" style="font-size:12.5px">${esc(x.basis||'')}${x.note?' · '+esc(x.note):''}${x.error?`<div style="color:var(--bad)">${esc(x.error)}</div>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No results.</td></tr>'}</tbody></table></div>`;
    $('#erDetail').scrollIntoView({behavior:'smooth'}); });
  const addCases = async rows => { if (!rows.length) { toast('Nothing new to add'); return; } await q(sb.from('agent_evals').insert(rows)); toast(`Added ${rows.length} cases`); openAgent(a.id,'evals'); };
  $('#ecLeads').onclick=async()=>{ try{ const have=new Set(cases.map(c=>c.lead_id).filter(Boolean)); const ls=await q(sb.from('leads').select('id,title,company,location,raw_snippet,jd_text,job_stream_id,fit_score').order('created_at',{ascending:false}).limit(200));
      await addCases(ls.filter(l=>!have.has(l.id)).map(l=>({agent_id:a.id, job_stream_id:l.job_stream_id, lead_id:l.id, input:{title:l.title, company:l.company, location:l.location, snippet:l.raw_snippet, jd_text:l.jd_text}, note:'from lead · old score '+(l.fit_score??'none')}))); }catch(e){ err(e); } };
  $('#ecApps').onclick=async()=>{ try{ const have=new Set(cases.map(c=>c.application_id).filter(Boolean)); const as=await q(sb.from('applications').select('id,title,company,location,job_stream_id,status,final_status').order('created_at',{ascending:false}).limit(300));
      await addCases(as.filter(x=>!have.has(x.id)).map(x=>({agent_id:a.id, job_stream_id:x.job_stream_id, application_id:x.id, input:{title:x.title, company:x.company, location:x.location}, note:'from application · '+(x.final_status||x.status)}))); }catch(e){ err(e); } };
  $('#ecMan').onclick=()=>{ openModal(`<h3>New eval case</h3><div class="grid2"><div><label>Title</label><input id="mT"></div><div><label>Company</label><input id="mC"></div><div><label>Location</label><input id="mL"></div><div><label>Stream</label><select id="mS">${state.streams.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div></div>
      <label>Snippet or JD text (optional)</label><textarea id="mJ"></textarea><label>Your band</label><select id="mB">${Object.entries(AG_BANDS).map(([k,b])=>`<option value="${k}">${b.label}</option>`).join('')}</select>
      <div class="actions"><button class="primary" id="mOk">Add</button><button id="mNo">Cancel</button></div><div class="err" id="mErr"></div>`);
    $('#modal').style.maxWidth='';
    $('#mNo').onclick=()=>openAgent(a.id,'evals');
    $('#mOk').onclick=async()=>{ try{ if (!$('#mT').value.trim()) throw new Error('Title is required.'); const b=$('#mB').value;
      await q(sb.from('agent_evals').insert({agent_id:a.id, job_stream_id:$('#mS').value, input:{title:$('#mT').value.trim(), company:$('#mC').value.trim(), location:$('#mL').value.trim(), snippet:null, jd_text:$('#mJ').value.trim()||null}, expected_band:b, expected_min:AG_BANDS[b].min, expected_max:AG_BANDS[b].max, note:'added by hand'}));
      toast('Case added'); openAgent(a.id,'evals'); }catch(e){ $('#mErr').textContent=e.message||e; } }; };
}

/* ===================== Settings ===================== */
async function renderSettings(el){
  const s = state.settings;
  el.innerHTML = `<h2>Settings</h2><div class="grid2"><div>
    <h3>Decision loop</h3>
    <label for="s_fit">Fit gate (0 to 100): leads at or above this get a push</label><input id="s_fit" type="number" value="${s.fit_threshold??60}">
    <label for="s_fresh">Freshness cutoff, days (older leads are parked)</label><input id="s_fresh" type="number" value="${s.freshness_days??14}">
    <label for="s_cap">Daily cap on push messages</label><input id="s_cap" type="number" value="${s.daily_cap??8}">
    <label>Quiet hours</label><div class="grid2"><input id="s_qf" type="time" value="${esc(s.quiet_hours?.from||'23:00')}"><input id="s_qt" type="time" value="${esc(s.quiet_hours?.to||'07:00')}"></div>
    <label for="s_stale">"Going stale" after N days without a touch</label><input id="s_stale" type="number" value="${s.stale_days??10}">
    <label for="s_ghost">Auto-mark ghosted after N days (reversible)</label><input id="s_ghost" type="number" value="${s.ghost_days??30}">
    <h3>Notification channel</h3>
    <label for="s_ch">Channel</label><select id="s_ch"><option ${s.channel==='telegram'?'selected':''}>telegram</option><option ${s.channel==='whatsapp'?'selected':''}>whatsapp</option><option ${s.channel==='web_push'?'selected':''}>web_push</option><option ${s.channel==='email'?'selected':''}>email</option></select>
    <label for="s_tg">Telegram chat id (filled after you message the bot once)</label><input id="s_tg" value="${esc(s.telegram_chat_id||'')}">
    <div class="actions"><button class="primary" id="saveS">Save settings</button></div><div class="err" id="sErr"></div>
  </div><div>
    <h3>Account</h3><p>Signed in as <b>${esc(state.user.email)}</b>. This is the only account that can sign in; other sign-ups are blocked at the database.</p>
    <label for="np">New password (12+ characters)</label><input id="np" type="password" autocomplete="new-password"><label for="np2">Repeat</label><input id="np2" type="password" autocomplete="new-password">
    <div class="actions"><button id="chPw">Change password</button></div><div class="err" id="pwErr"></div>
    <h3>Reference data</h3><p class="muted">Sources / portals and park reasons are editable here.</p><div class="actions"><button id="edBoards">Sources & portals</button><button id="edNoise">Park reasons</button><button id="edCrit">Filter criteria</button></div>
    <h3>About</h3><p class="muted">Job Application Driver v1.0.5 · 17 Oct 2026 · data in Supabase Project Zero, row-level security by owner · design doc v1.7 in PMOS/JobTracker.</p>
  </div></div>`;
  $('#saveS').onclick=async()=>{ try{ const ns={...s, fit_threshold:Number($('#s_fit').value), freshness_days:Number($('#s_fresh').value), daily_cap:Number($('#s_cap').value), quiet_hours:{from:$('#s_qf').value,to:$('#s_qt').value}, stale_days:Number($('#s_stale').value), ghost_days:Number($('#s_ghost').value), channel:$('#s_ch').value, telegram_chat_id:$('#s_tg').value||null}; await q(sb.from('user_settings').upsert({owner_id:state.user.id, settings:ns, updated_at:new Date().toISOString()})); state.settings=ns; toast('Settings saved'); }catch(e){ $('#sErr').textContent=e.message||e; } };
  $('#chPw').onclick=async()=>{ const a=$('#np').value,b=$('#np2').value; if (a.length<12) return $('#pwErr').textContent='Use at least 12 characters.'; if (a!==b) return $('#pwErr').textContent='Passwords do not match.'; const {error}=await sb.auth.updateUser({password:a}); if (error) return $('#pwErr').textContent=error.message; $('#np').value=$('#np2').value=''; $('#pwErr').textContent=''; toast('Password changed'); };
  $('#edBoards').onclick=()=>simpleList('job_boards',[{k:'name',label:'Name',t:'text'},{k:'kind',label:'Kind',t:'select',opts:['portal','agency','direct','referral','direct_outreach','career_page']},{k:'base_url',label:'URL',t:'text'},{k:'is_active',label:'Active',t:'bool'}],'name');
  $('#edNoise').onclick=()=>simpleList('noise_reasons',[{k:'reason',label:'Reason',t:'text'}],'reason');
  $('#edCrit').onclick=()=>simpleList('filter_criteria',[streamFk,{k:'criterion_type',label:'Type',t:'select',opts:['title_include','title_exclude','location_allow']},{k:'value',label:'Value',t:'text'},{k:'is_active',label:'Active',t:'bool'}],'value');
}
async function simpleList(table, fields, labelCol){
  const rows = await q(sb.from(table).select('*').order(labelCol));
  openModal(`<h3>${esc(table.replace('_',' '))}</h3><table><tbody>${rows.map(r=>`<tr class="row" data-id="${r.id}"><td>${esc(r[labelCol])}</td><td class="muted">${esc(r.kind||r.criterion_type||'')}${r.job_stream_id?' · '+esc(streamName(r.job_stream_id)):''}</td><td>${r.is_active===false?'<span class="tag">inactive</span>':''}</td></tr>`).join('')}</tbody></table><div class="actions"><button id="add">+ Add</button><button id="close" class="right">Close</button></div>`);
  const re=()=>simpleList(table,fields,labelCol);
  $('#close').onclick=()=>{ closeModal(); state.boards=[]; };
  $('#add').onclick=()=>editRecord({table,title:'New',fields,row:null,defaults:{is_active:true,job_stream_id:selStreams()[0]||PM_STREAM},after:re});
  $('#modal').querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>editRecord({table,title:'Edit',fields,row:rows.find(r=>r.id===tr.dataset.id),after:re}));
}
